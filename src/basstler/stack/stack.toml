# Stacked-PR config - the fork-staging / upstream-review workflow.
#
# This file carries the shipped defaults only, and names nobody's repository. A project
# names its own upstream in its committed `.claude/basstler/stack.toml`, which outranks
# these values, and a `.claude/personal/stack.toml` on the personal-notes branch, if present,
# layers per-user overrides on top of both (see `Configuration.load` in `stack/settings.py`).
#
# The stack itself (which branches exist, how they depend on each other, and their review state) is
# read live from GitHub, not declared here:
#
#   * the dependency TREE  = each fork PR's BASE branch (base = parent). Set it on GitHub.
#   * draft <-> ready      = the fork PR's draft toggle. Un-draft to approve for review.
#   * in-review            = an open upstream PR opened from the branch (read by the board
#                            export); a pass mirrors it as the `in_review_label` and a link
#                            in the fork PR's description.
#   * merged               = branch is an ancestor of `<upstream_remote>/<upstream_base>` (pure git).
#   * needs-resolution     = the `needs_resolution_label` on the fork PR (set by a maintenance pass when it
#                            delegates a restack conflict to the branch's owning session; withholds
#                            the branch from promotion until cleared).

in_review_label = "in-review"  # fork-PR label a pass sets while an upstream PR is open
rebase_label = "rebase"        # fork-PR label opting a branch into rebase instead of the default merge
needs_resolution_label = "needs-resolution"  # set by a maintenance pass on a delegated restack conflict
# fork_repository: deliberately unset - the fork is derived from `fork_remote`'s URL, so this file
# names nobody's fork. Set it (in a personal override) only for a checkout whose fork remote is not
# the fork.
fork_remote = "origin"
# upstream_repository: deliberately unset - the project names it in .claude/basstler/stack.toml.
upstream_remote = "upstream"     # name to give the upstream remote when one has to be added
upstream_base = "main"
