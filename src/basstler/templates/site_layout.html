<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %}</title>
<link rel="stylesheet" href="{{ stylesheet_url }}">
</head>
<body>
<div class="page {% block page_class %}{% endblock %}" id="{% block page_id %}site-page{% endblock %}">
{% block content %}{% endblock %}
  <footer class="site-footer">
    Generated by <code>basstler.plan_site</code> from every repository the hub file lists, cross-checked live against GitHub.
  </footer>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
