<!doctype html>
<html lang="en"{% for choice in appearance.viewer_choices %} {{ choice.attribute }}="{{ choice.default }}"{% endfor %}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %}</title>
<script>
{% include appearance_script_template %}
</script>
<link rel="stylesheet" href="{{ stylesheet_url }}">
</head>
<body>
<div class="page {% block page_class %}{% endblock %}" id="{% block page_id %}site-page{% endblock %}">
  <nav class="appearance-menu" aria-label="Appearance">
  {% for choice in appearance.viewer_choices %}
    <label>{{ choice.label }}
      <select name="{{ choice.attribute }}">
      {% for option in choice.options %}
        <option value="{{ option.value }}"{% if option.value == choice.default %} selected{% endif %}>{{ option.title }}</option>
      {% endfor %}
      </select>
    </label>
  {% endfor %}
  </nav>
{% block content %}{% endblock %}
  <footer class="site-footer">
    Generated by <code>basstler.plan_site</code> from every repository the hub file lists, cross-checked live against GitHub.
  </footer>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
