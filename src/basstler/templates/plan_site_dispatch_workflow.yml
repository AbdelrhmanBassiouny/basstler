# Written by basstler's /setup-personal-notes (python -m basstler.plan_site.publication);
# re-run that to update it rather than editing it here.
{% block header %}
name: Plan site dispatch

# Every push to the notes branch starts the plan site's build in {{ site_repository }}.
on:
  push:
    branches: [{{ notes_branch }}]
  workflow_dispatch: {}
{% endblock %}

permissions: {}

concurrency:
  group: {% block concurrency_group %}plan-site-dispatch{% endblock %}

  cancel-in-progress: true

jobs:
  {{ job }}:
    name: Start the plan site build
    if: {% block condition %}github.repository == '{{ notes_repository }}'{% endblock %}

    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the build
        env:
          {{ token_variable }}: {{ '${{' }} secrets.{{ token_secret }} {{ '}}' }}
        run: |
          if [ -z "${{ token_variable }}" ]; then
            echo "::error title={{ token_secret }} is not stored::{{ notes_repository }} stores no {{ token_secret }} secret, so this run started no build in {{ site_repository }}. Run /setup-personal-notes, or create the token at {{ token_form_url }} and store it at {{ secrets_page }}"
            exit 1
          fi
          gh workflow run {{ site_workflow_name }} {{ repository_option }} {{ site_repository }}
