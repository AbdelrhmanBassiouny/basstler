{% extends "plan_site_dispatch_workflow.yml" %}
{% block header %}
name: Plan site merge dispatch

# Every pull request opened, reopened, marked ready, turned back into a draft, merged or
# closed, a fork's included, starts the plan site's build in {{ site_repository }}, so the
# site shows its state without waiting for the next push to the notes branch. A merge
# also records the plan items whose pull requests merged on the notes branch. It runs on
# pull_request_target to read the token for a fork's pull request too; it checks out
# nothing and reads nothing the pull request controls.
on:
  pull_request_target:
    types: [{{ pull_request_activities | join(", ") }}]
{% endblock %}
{% block concurrency_group %}plan-site-merge{% endblock %}
{% block further_jobs %}
  {{ record_job }}:
    name: Record merged plan items
    if: github.repository == '{{ notes_repository }}' && github.event.pull_request.merged
    permissions:
      contents: write
    uses: {{ merged_items_workflow }}
    with:
{% for input, value in merged_items_inputs.items() %}
      {{ input }}: {{ value }}
{% endfor %}

{% endblock %}
