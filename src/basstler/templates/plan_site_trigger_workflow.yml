# Written by python -m basstler.plan_site_workflows install-trigger; re-run that to
# update it rather than editing it here.
name: Plan site trigger

# A plan push starts the plan site's build on the default branch, the only branch its
# Pages environment deploys from.

on:
  push:
    branches: [{{ notes_branch }}]
    paths: ["{{ plans_directory }}/**"]

permissions:
  actions: write

concurrency:
  group: plan-site-trigger
  cancel-in-progress: true

jobs:
  dispatch:
    name: Start the plan site build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the plan site build
        env:
          GH_TOKEN: {% raw %}${{ github.token }}{% endraw %}

        run: >-
          gh workflow run {{ build_workflow }}
          --repo "{% raw %}${{ github.repository }}{% endraw %}"
          --ref "{% raw %}${{ github.event.repository.default_branch }}{% endraw %}"
