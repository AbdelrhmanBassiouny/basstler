{% set rose = color(palette.accent) %}
{% set lace = rose.mixed_with(color(palette.surface), 0.72) %}
{% set dark = rose.darkened(0.5) %}
{% set leaf = color(palette.good) %}
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="180" height="180" viewBox="0 0 180 180">
<defs>
<radialGradient id="petal" cx="35%" cy="30%" r="85%"><stop offset="0" stop-color="{{ rose.lightened(0.55) }}"/><stop offset="0.55" stop-color="{{ rose }}"/><stop offset="1" stop-color="{{ dark }}"/></radialGradient>
<linearGradient id="satin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{{ rose.lightened(0.5) }}"/><stop offset="0.45" stop-color="{{ rose }}"/><stop offset="1" stop-color="{{ rose.darkened(0.35) }}"/></linearGradient>
<linearGradient id="blade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{{ leaf.lightened(0.4) }}"/><stop offset="1" stop-color="{{ leaf.darkened(0.45) }}"/></linearGradient>
<g id="leaf"><path d="M0 0 C-7 -4 -7 -13 0 -19 C7 -13 7 -4 0 0 Z" fill="url(#blade)" stroke="{{ leaf.darkened(0.6) }}" stroke-width="1"/><path d="M0 -1 V-15" stroke="{{ leaf.darkened(0.55) }}" stroke-width="0.7"/></g>
<g id="edge">
{% for x in range(60, 120, 12) %}
<path d="M{{ x }} 20 a6 7.5 0 0 1 12 0 Z" fill="{{ lace }}" stroke="{{ dark }}" stroke-width="1.1"/>
<circle cx="{{ x + 6 }}" cy="16.4" r="1.7" fill="{{ dark }}" opacity="0.7"/>
<path d="M{{ x }} 40 a6 6.5 0 0 0 12 0 Z" fill="{{ lace }}" stroke="{{ dark }}" stroke-width="1"/>
{% endfor %}
<rect x="60" y="20" width="60" height="20" fill="url(#satin)"/>
<path d="M60 20 H120 M60 40 H120" stroke="{{ dark }}" stroke-width="1.4"/>
<path d="M60 23.4 H120" stroke="{{ rose.lightened(0.75) }}" stroke-width="1.2" stroke-dasharray="3 3"/>
<path d="M60 36.6 H120" stroke="{{ dark }}" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
<path d="M60 30 q7.5 -6 15 0 t15 0 t15 0 t15 0" fill="none" stroke="{{ rose.lightened(0.7) }}" stroke-width="1.5"/>
</g>
<g id="corner">
<use xlink:href="#leaf" transform="translate(27 27) rotate(-45) scale(1.5)"/>
<use xlink:href="#leaf" transform="translate(40 24) rotate(62) scale(1.15)"/>
<use xlink:href="#leaf" transform="translate(24 40) rotate(-152) scale(1.15)"/>
{% for angle in range(0, 360, 72) %}
<circle cx="30" cy="16.5" r="9.5" fill="url(#petal)" stroke="{{ dark }}" stroke-width="1.1" transform="rotate({{ angle }} 30 30)"/>
{% endfor %}
{% for angle in range(36, 396, 72) %}
<circle cx="30" cy="22" r="7.4" fill="url(#petal)" stroke="{{ dark }}" stroke-width="1" transform="rotate({{ angle }} 30 30)"/>
{% endfor %}
{% for angle in range(0, 360, 120) %}
<circle cx="30" cy="26" r="5" fill="url(#petal)" stroke="{{ dark }}" stroke-width="0.9" transform="rotate({{ angle }} 30 30)"/>
{% endfor %}
<path d="M27.5 30 a2.5 2.5 0 1 1 5 0 a4 4 0 0 1 -6.5 3" fill="none" stroke="{{ dark }}" stroke-width="1.1" stroke-linecap="round"/>
</g>
</defs>
<rect x="30" y="30" width="120" height="120" fill="none" stroke="{{ rose }}" stroke-width="20"/>
<use xlink:href="#edge"/>
<use xlink:href="#edge" transform="rotate(90 90 90)"/>
<use xlink:href="#edge" transform="rotate(180 90 90)"/>
<use xlink:href="#edge" transform="rotate(270 90 90)"/>
<use xlink:href="#corner"/>
<use xlink:href="#corner" transform="matrix(-1 0 0 1 180 0)"/>
<use xlink:href="#corner" transform="matrix(1 0 0 -1 0 180)"/>
<use xlink:href="#corner" transform="matrix(-1 0 0 -1 180 180)"/>
</svg>
