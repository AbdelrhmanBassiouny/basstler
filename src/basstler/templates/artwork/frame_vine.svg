<use xlink:href="#rising" stroke="{{ wood.darkened(0.4) }}" stroke-width="1" stroke-dasharray="4 5" transform="translate(1.1 2.6)"/>
<use xlink:href="#rising" stroke="{{ wood.lightened(0.5) }}" stroke-width="1.5" stroke-dasharray="9 4" transform="translate(-1.1 -2.6)"/>
<use xlink:href="#over" stroke="{{ wood.darkened(0.72) }}" stroke-width="12.5"/>
<use xlink:href="#over" stroke="{{ wood }}" stroke-width="10"/>
<use xlink:href="#over" stroke="{{ wood.darkened(0.4) }}" stroke-width="1" stroke-dasharray="4 5" transform="translate(1.1 2.6)"/>
