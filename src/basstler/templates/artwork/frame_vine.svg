{% set wood = color(palette.border).mixed_with(color(palette.text), 0.35).mixed_with(color("#7A4A1E"), 0.5) %}
{% set leaf = color(palette.accent) %}
{% set berry = color(palette.bad) %}
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="180" height="180" viewBox="0 0 180 180">
<defs>
<linearGradient id="blade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{{ leaf.lightened(0.45) }}"/><stop offset="0.55" stop-color="{{ leaf }}"/><stop offset="1" stop-color="{{ leaf.darkened(0.45) }}"/></linearGradient>
<radialGradient id="berry" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="{{ berry.lightened(0.6) }}"/><stop offset="0.5" stop-color="{{ berry.darkened(0.2) }}"/><stop offset="1" stop-color="{{ berry.darkened(0.7) }}"/></radialGradient>
<g id="leaf"><path d="M0 0 C-7 -4 -7 -13 0 -19 C7 -13 7 -4 0 0 Z" fill="url(#blade)" stroke="{{ leaf.darkened(0.6) }}" stroke-width="1"/><path d="M0 -1 V-15 M0 -6 l-3 -3 M0 -6 l3 -3 M0 -10 l-2.4 -2.4 M0 -10 l2.4 -2.4" fill="none" stroke="{{ leaf.darkened(0.55) }}" stroke-width="0.7"/></g>
<path id="stem" d="M60 30 C70 15 80 15 90 30 S110 45 120 30"/>
<g id="edge" fill="none" stroke-linecap="round">
<path d="M60 24 q10 3 20 0 t20 1 t20 -1 M60 33 q12 -3 24 0 t18 0 t18 0 M60 38 q8 2 16 0 t22 0 t22 0" stroke="{{ wood.darkened(0.45) }}" stroke-width="0.9" opacity="0.8"/>
<use xlink:href="#leaf" transform="translate(73 21) rotate(-28)"/>
<use xlink:href="#leaf" transform="translate(82 21) rotate(35) scale(0.8)"/>
<use xlink:href="#leaf" transform="translate(103 39) rotate(152)"/>
<use xlink:href="#leaf" transform="translate(112 39) rotate(215) scale(0.8)"/>
<use xlink:href="#stem" stroke="{{ leaf.darkened(0.65) }}" stroke-width="5.5"/>
<use xlink:href="#stem" stroke="{{ leaf.darkened(0.2) }}" stroke-width="3.4"/>
<use xlink:href="#stem" stroke="{{ leaf.lightened(0.45) }}" stroke-width="1" transform="translate(0 -0.9)"/>
<circle cx="90" cy="30" r="3.2" fill="url(#berry)" stroke="{{ berry.darkened(0.7) }}" stroke-width="0.7"/>
</g>
<path id="tendril" d="M30 30 C20 22 10 30 12 40 L13.4 42.9 L15.8 44.8 L18.6 45.4 L21.3 44.7 L23.4 43 L24.4 40.6 L24.3 38.2 L23.2 36.2 L21.5 35 L19.6 34.8 L18 35.5 L17 36.8 L16.8 38.3 L17.4 39.5"/>
<g id="corner" fill="none" stroke-linecap="round">
<use xlink:href="#leaf" transform="translate(26 26) rotate(-45) scale(1.45)"/>
<use xlink:href="#leaf" transform="translate(30 24) rotate(8) scale(1.1)"/>
<use xlink:href="#leaf" transform="translate(24 30) rotate(-98) scale(1.1)"/>
<use xlink:href="#leaf" transform="translate(38 26) rotate(58) scale(1.05)"/>
<use xlink:href="#leaf" transform="translate(26 38) rotate(-148) scale(1.05)"/>
<use xlink:href="#tendril" stroke="{{ leaf.darkened(0.65) }}" stroke-width="4.6"/>
<use xlink:href="#tendril" stroke="{{ leaf.darkened(0.15) }}" stroke-width="2.6"/>
<g transform="matrix(0 1 1 0 0 0)">
<use xlink:href="#tendril" stroke="{{ leaf.darkened(0.65) }}" stroke-width="4.6"/>
<use xlink:href="#tendril" stroke="{{ leaf.darkened(0.15) }}" stroke-width="2.6"/>
</g>
<path d="M30 30 C40 24 50 34 60 30 M30 30 C24 40 34 50 30 60" stroke="{{ leaf.darkened(0.65) }}" stroke-width="5.5"/>
<path d="M30 30 C40 24 50 34 60 30 M30 30 C24 40 34 50 30 60" stroke="{{ leaf.darkened(0.2) }}" stroke-width="3.4"/>
<circle cx="27" cy="27" r="5" fill="url(#berry)" stroke="{{ berry.darkened(0.7) }}" stroke-width="0.8"/>
<circle cx="34.5" cy="29.5" r="4.4" fill="url(#berry)" stroke="{{ berry.darkened(0.7) }}" stroke-width="0.8"/>
<circle cx="29.5" cy="34.5" r="4.4" fill="url(#berry)" stroke="{{ berry.darkened(0.7) }}" stroke-width="0.8"/>
</g>
</defs>
<rect x="30" y="30" width="120" height="120" rx="6" fill="none" stroke="{{ wood }}" stroke-width="24"/>
<rect x="19" y="19" width="142" height="142" rx="12" fill="none" stroke="{{ wood.darkened(0.6) }}" stroke-width="2"/>
<rect x="21.6" y="21.6" width="136.8" height="136.8" rx="10" fill="none" stroke="{{ wood.lightened(0.4) }}" stroke-width="2.2"/>
<rect x="39.4" y="39.4" width="101.2" height="101.2" fill="none" stroke="{{ wood.darkened(0.35) }}" stroke-width="3.2"/>
<rect x="41.3" y="41.3" width="97.4" height="97.4" fill="none" stroke="{{ wood.darkened(0.7) }}" stroke-width="1.4"/>
<use xlink:href="#edge"/>
<use xlink:href="#edge" transform="rotate(90 90 90)"/>
<use xlink:href="#edge" transform="rotate(180 90 90)"/>
<use xlink:href="#edge" transform="rotate(270 90 90)"/>
<use xlink:href="#corner"/>
<use xlink:href="#corner" transform="matrix(-1 0 0 1 180 0)"/>
<use xlink:href="#corner" transform="matrix(1 0 0 -1 0 180)"/>
<use xlink:href="#corner" transform="matrix(-1 0 0 -1 180 180)"/>
</svg>
