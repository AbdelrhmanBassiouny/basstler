<use xlink:href="#tight" stroke="{{ wood.darkened(0.72) }}" stroke-width="12.5"/>
<use xlink:href="#tight" stroke="{{ wood }}" stroke-width="10"/>
<use xlink:href="#tight" stroke="{{ wood.darkened(0.4) }}" stroke-width="1" stroke-dasharray="4 5" transform="translate(1.1 2.6)"/>
<use xlink:href="#tight" stroke="{{ wood.lightened(0.5) }}" stroke-width="1.5" stroke-dasharray="9 4" transform="translate(-1.1 -2.6)"/>
<use xlink:href="#wide" stroke="{{ wood.darkened(0.72) }}" stroke-width="12.5"/>
<use xlink:href="#wide" stroke="{{ wood }}" stroke-width="10"/>
<use xlink:href="#wide" stroke="{{ wood.darkened(0.4) }}" stroke-width="1" stroke-dasharray="4 5" transform="translate(1.1 2.6)"/>
<use xlink:href="#wide" stroke="{{ wood.lightened(0.5) }}" stroke-width="1.5" stroke-dasharray="9 4" transform="translate(-1.1 -2.6)"/>
<use xlink:href="#leaf" transform="translate(38 38) rotate(-45) scale(1.05)"/>
<use xlink:href="#leaf" transform="translate(42 36) rotate(30) scale(0.75)"/>
<use xlink:href="#leaf" transform="translate(36 42) rotate(-120) scale(0.75)"/>
<circle cx="35" cy="35" r="4.2" fill="url(#berry)" stroke="{{ berry.darkened(0.7) }}" stroke-width="0.7"/>
<circle cx="41" cy="39" r="3.6" fill="url(#berry)" stroke="{{ berry.darkened(0.7) }}" stroke-width="0.7"/>
<circle cx="39" cy="41.5" r="3.2" fill="url(#berry)" stroke="{{ berry.darkened(0.7) }}" stroke-width="0.7"/>
</g>
</defs>
<use xlink:href="#edge"/>
<use xlink:href="#edge" transform="rotate(90 90 90)"/>
<use xlink:href="#edge" transform="rotate(180 90 90)"/>
<use xlink:href="#edge" transform="rotate(270 90 90)"/>
<use xlink:href="#corner"/>
<use xlink:href="#corner" transform="matrix(-1 0 0 1 180 0)"/>
<use xlink:href="#corner" transform="matrix(1 0 0 -1 0 180)"/>
<use xlink:href="#corner" transform="matrix(-1 0 0 -1 180 180)"/>
</svg>
