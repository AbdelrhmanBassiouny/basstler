<circle cx="88.4" cy="35.4" r="2.9" fill="url(#berry)" stroke="{{ berry.darkened(0.7) }}" stroke-width="0.7"/>
<circle cx="92.2" cy="37" r="2.5" fill="url(#berry)" stroke="{{ berry.darkened(0.7) }}" stroke-width="0.7"/>
</g>
<path id="tendril" d="M27 27 C19 21 10 27 12 37 L13.4 39.9 L15.8 41.8 L18.6 42.4 L21.3 41.7 L23.4 40 L24.4 37.6 L24.3 35.2 L23.2 33.2 L21.5 32 L19.6 31.8 L18 32.5 L17 33.8 L16.8 35.3 L17.4 36.5"/>
<g id="corner" fill="none" stroke-linecap="butt" stroke-linejoin="round">
<use xlink:href="#leaf" transform="translate(24 24) rotate(-45) scale(1.3)"/>
<use xlink:href="#leaf" transform="translate(31 20) rotate(12) scale(1.0)"/>
<use xlink:href="#leaf" transform="translate(20 31) rotate(-102) scale(1.0)"/>
<use xlink:href="#leaf" transform="translate(42 22) rotate(50) scale(0.85)"/>
<use xlink:href="#leaf" transform="translate(22 42) rotate(-140) scale(0.85)"/>
