{% set wood = color(palette.border).mixed_with(color(palette.text), 0.35).mixed_with(color("#7A4A1E"), 0.5) %}
{% set leaf = color(palette.accent) %}
{% set berry = color(palette.bad) %}
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="180" height="180" viewBox="0 0 180 180">
<defs>
<linearGradient id="blade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{{ leaf.lightened(0.45) }}"/><stop offset="0.55" stop-color="{{ leaf }}"/><stop offset="1" stop-color="{{ leaf.darkened(0.45) }}"/></linearGradient>
<radialGradient id="berry" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="{{ berry.lightened(0.6) }}"/><stop offset="0.5" stop-color="{{ berry.darkened(0.2) }}"/><stop offset="1" stop-color="{{ berry.darkened(0.7) }}"/></radialGradient>
<g id="leaf"><path d="M0 0 C-7 -4 -7 -13 0 -19 C7 -13 7 -4 0 0 Z" fill="url(#blade)" stroke="{{ leaf.darkened(0.6) }}" stroke-width="1"/><path d="M0 -1 V-15 M0 -6 l-3 -3 M0 -6 l3 -3 M0 -10 l-2.4 -2.4 M0 -10 l2.4 -2.4" fill="none" stroke="{{ leaf.darkened(0.55) }}" stroke-width="0.7"/></g>
<path id="rising" d="M60 36.00 L62 37.66 L64 39.25 L66 40.70 L68 41.95 L70 42.93 L72 43.61 L74 43.96 L76 43.96 L78 43.61 L80 42.93 L82 41.95 L84 40.70 L86 39.25 L88 37.66 L90 36.00 L92 34.34 L94 32.75 L96 31.30 L98 30.05 L100 29.07 L102 28.39 L104 28.04 L106 28.04 L108 28.39 L110 29.07 L112 30.05 L114 31.30 L116 32.75 L118 34.34 L120 36.00"/>
<path id="falling" d="M60 36.00 L62 34.34 L64 32.75 L66 31.30 L68 30.05 L70 29.07 L72 28.39 L74 28.04 L76 28.04 L78 28.39 L80 29.07 L82 30.05 L84 31.30 L86 32.75 L88 34.34 L90 36.00 L92 37.66 L94 39.25 L96 40.70 L98 41.95 L100 42.93 L102 43.61 L104 43.96 L106 43.96 L108 43.61 L110 42.93 L112 41.95 L114 40.70 L116 39.25 L118 37.66 L120 36.00"/>
<path id="over" d="M82 30.05 L83 30.65 L84 31.30 L85 32.00 L86 32.75 L87 33.53 L88 34.34 L89 35.16 L90 36.00 L91 36.84 L92 37.66 L93 38.47 L94 39.25 L95 40.00 L96 40.70 L97 41.35 L98 41.95"/>
<path id="wide" d="M60 36 C28 16 16 28 36 60"/>
<path id="tight" d="M60 36 C48 43.5 43.5 48 36 60"/>
<path id="twig" d="M0 0 q1 -5 5 -8"/>
<g id="edge" fill="none" stroke-linecap="butt" stroke-linejoin="round">
<use xlink:href="#leaf" transform="translate(72 24) rotate(-34) scale(0.85)"/>
<use xlink:href="#leaf" transform="translate(78 23) rotate(26) scale(0.7)"/>
<use xlink:href="#leaf" transform="translate(102 23) rotate(-26) scale(0.7)"/>
<use xlink:href="#leaf" transform="translate(108 24) rotate(34) scale(0.85)"/>
<use xlink:href="#leaf" transform="translate(75 49) rotate(170) scale(0.45)"/>
<use xlink:href="#leaf" transform="translate(105 49) rotate(190) scale(0.45)"/>
<use xlink:href="#falling" stroke="{{ wood.darkened(0.72) }}" stroke-width="12.5"/>
