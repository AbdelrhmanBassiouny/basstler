{% set iron = color(palette.border).mixed_with(color("#4A4E57"), 0.6) %}
{% set fire = color(palette.accent) %}
{% set hot = fire.mixed_with(color("#FFE08A"), 0.7) %}
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="180" height="180" viewBox="0 0 180 180">
<defs>
<linearGradient id="bar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{{ iron.lightened(0.45) }}"/><stop offset="0.5" stop-color="{{ iron }}"/><stop offset="1" stop-color="{{ iron.darkened(0.6) }}"/></linearGradient>
<linearGradient id="flame" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="{{ hot }}"/><stop offset="0.45" stop-color="{{ fire }}"/><stop offset="1" stop-color="{{ fire.darkened(0.45) }}"/></linearGradient>
<radialGradient id="coal" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFF6D0"/><stop offset="0.5" stop-color="{{ hot }}"/><stop offset="1" stop-color="{{ fire.darkened(0.3) }}"/></radialGradient>
<path id="curl" transform="translate(-5 2)" d="M34 24 C34 10 43 4 50 5 L52.9 6 L55 8 L56 10.6 L56 13.2 L55 15.5 L53.2 17.1 L51 17.9 L48.9 17.7 L47.1 16.7 L45.9 15.2 L45.4 13.5 L45.7 11.9 L46.6 10.6 L47.9 9.9 L49.2 9.8"/>
<g id="edge" fill="none" stroke-linecap="round">
<path d="M60 18 C68 6 82 6 90 18 C98 6 112 6 120 18" stroke="{{ iron.darkened(0.7) }}" stroke-width="5.6"/>
<path d="M60 18 C68 6 82 6 90 18 C98 6 112 6 120 18" stroke="{{ iron }}" stroke-width="3.4"/>
<path d="M60 17 C68 5 82 5 90 17 C98 5 112 5 120 17" stroke="{{ iron.lightened(0.5) }}" stroke-width="0.9"/>
<path d="M60 30 H120" stroke="{{ fire.darkened(0.5) }}" stroke-width="6"/>
<path d="M60 30 q7.5 -3.4 15 0 t15 0 t15 0 t15 0" stroke="{{ fire }}" stroke-width="3.4"/>
<path d="M60 30 q7.5 -3.4 15 0 t15 0 t15 0 t15 0" stroke="{{ hot }}" stroke-width="1.2"/>
<circle cx="75" cy="37.5" r="2.2" fill="{{ iron.lightened(0.35) }}" stroke="{{ iron.darkened(0.7) }}" stroke-width="0.9" stroke-linecap="butt"/>
<circle cx="105" cy="37.5" r="2.2" fill="{{ iron.lightened(0.35) }}" stroke="{{ iron.darkened(0.7) }}" stroke-width="0.9"/>
<ellipse cx="68" cy="23.4" rx="3" ry="1.2" fill="{{ iron.darkened(0.45) }}" opacity="0.6"/>
<ellipse cx="97" cy="23" rx="3.6" ry="1.3" fill="{{ iron.darkened(0.45) }}" opacity="0.6"/>
<ellipse cx="112" cy="24" rx="2.4" ry="1" fill="{{ iron.lightened(0.5) }}" opacity="0.5"/>
</g>
<g id="corner" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M33 27 C27 22 26 13 17 12 C20 8 12 7 1 0 C7 12 8 20 12 17 C13 26 22 27 27 33 Z" fill="url(#flame)" stroke="{{ fire.darkened(0.6) }}" stroke-width="1.2"/>
<path d="M27 26 C22 21 20 16 13 14 C14 19 19 22 26 27 Z" fill="{{ hot }}" opacity="0.9"/>
<path d="M36 24 C32 18 34 10 29 3 C37 8 41 15 40 24 Z" fill="url(#flame)" stroke="{{ fire.darkened(0.6) }}" stroke-width="1.1"/>
<path d="M24 36 C18 32 10 34 3 29 C8 37 15 41 24 40 Z" fill="url(#flame)" stroke="{{ fire.darkened(0.6) }}" stroke-width="1.1"/>
<use xlink:href="#curl" stroke="{{ iron.darkened(0.75) }}" stroke-width="7"/>
<use xlink:href="#curl" stroke="{{ iron }}" stroke-width="4.6"/>
<use xlink:href="#curl" stroke="{{ iron.lightened(0.5) }}" stroke-width="1.2" transform="translate(-0.8 -0.8)"/>
<g transform="matrix(0 1 1 0 0 0)">
<use xlink:href="#curl" stroke="{{ iron.darkened(0.75) }}" stroke-width="7"/>
<use xlink:href="#curl" stroke="{{ iron }}" stroke-width="4.6"/>
<use xlink:href="#curl" stroke="{{ iron.lightened(0.5) }}" stroke-width="1.2" transform="translate(-0.8 -0.8)"/>
</g>
<path d="M30 12 L48 30 L30 48 L12 30 Z" fill="url(#bar)" stroke="{{ iron.darkened(0.75) }}" stroke-width="2"/>
<path d="M30 15.5 L44.5 30" stroke="{{ iron.lightened(0.6) }}" stroke-width="1" opacity="0.8"/>
<circle cx="30" cy="30" r="7.5" fill="url(#coal)" stroke="{{ iron.darkened(0.75) }}" stroke-width="2"/>
</g>
</defs>
<rect x="30" y="30" width="120" height="120" fill="none" stroke="url(#bar)" stroke-width="24"/>
<rect x="19" y="19" width="142" height="142" fill="none" stroke="{{ iron.darkened(0.75) }}" stroke-width="2"/>
<rect x="21.5" y="21.5" width="137" height="137" fill="none" stroke="{{ iron.lightened(0.5) }}" stroke-width="1.4" opacity="0.8"/>
<rect x="41" y="41" width="98" height="98" fill="none" stroke="{{ iron.darkened(0.75) }}" stroke-width="2"/>
<use xlink:href="#edge"/>
<use xlink:href="#edge" transform="rotate(90 90 90)"/>
<use xlink:href="#edge" transform="rotate(180 90 90)"/>
<use xlink:href="#edge" transform="rotate(270 90 90)"/>
<use xlink:href="#corner"/>
<use xlink:href="#corner" transform="matrix(-1 0 0 1 180 0)"/>
<use xlink:href="#corner" transform="matrix(1 0 0 -1 0 180)"/>
<use xlink:href="#corner" transform="matrix(-1 0 0 -1 180 180)"/>
</svg>
