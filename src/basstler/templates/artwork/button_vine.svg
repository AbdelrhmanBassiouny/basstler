{% set wood = color(palette.border).mixed_with(color(palette.text), 0.35).mixed_with(color("#7A4A1E"), 0.5) %}
{% set leaf = color(palette.accent) %}
<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
<path d="M8 3 H28 Q33 3 33 8 V28 Q33 33 28 33 H8 Q3 33 3 28 V8 Q3 3 8 3 Z M12 12 V24 H24 V12 Z" fill-rule="evenodd" fill="{{ wood }}" stroke="{{ wood.darkened(0.65) }}" stroke-width="1.4"/>
<path d="M5 27 V9 Q5 5 9 5 H27" fill="none" stroke="{{ wood.lightened(0.45) }}" stroke-width="1.4"/>
<path d="M12 8.6 H24 M12 27.6 H24 M8.4 12 V24 M27.6 12 V24" fill="none" stroke="{{ wood.darkened(0.4) }}" stroke-width="0.8"/>
<rect x="11.4" y="11.4" width="13.2" height="13.2" fill="none" stroke="{{ wood.darkened(0.65) }}" stroke-width="1.1"/>
{% for angle, x, y in [(-45, 8, 8), (45, 28, 8), (-135, 8, 28), (135, 28, 28)] %}
<path d="M0 3.4 C-3.6 1 -3.6 -3 0 -5.6 C3.6 -3 3.6 1 0 3.4 Z" transform="translate({{ x }} {{ y }}) rotate({{ angle }})" fill="{{ leaf }}" stroke="{{ leaf.darkened(0.6) }}" stroke-width="0.8"/>
{% endfor %}
</svg>
