<title>{{ title }}</title>
<link rel="stylesheet" href="{{ style_file }}">
<div id="plan-dashboard-content"></div>
<script src="{{ script_file }}"></script>
<script>
  fetch("{{ content_file }}")
    .then(function (response) {
      if (!response.ok) {
        throw new Error(response.status + " " + response.statusText);
      }
      return response.text();
    })
    .then(function (content) {
      document.getElementById("plan-dashboard-content").innerHTML = content;
      planDashboardRevealLocationHash();
    })
    .catch(function (error) {
      document.getElementById("plan-dashboard-content").textContent =
        "The dashboard could not be loaded: " + error.message;
    });
</script>
