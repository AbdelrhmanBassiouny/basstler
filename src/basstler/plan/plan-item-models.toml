# The Claude model each plan-item skill recommends, when nothing else says otherwise.
#
# A .claude/personal/plan-item-models.toml on the personal-notes branch, if present,
# layers per-user overrides on top of these values.
#
# The values are the Claude Code model aliases: opus, sonnet and haiku, which always
# resolve to the newest model of that family.

kickoff_model = "sonnet"
resolve_model = "sonnet"
