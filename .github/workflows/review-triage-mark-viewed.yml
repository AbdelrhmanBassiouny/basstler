name: Review triage mark viewed

# Marks a pull request's mechanical files viewed for the account whose token the caller
# passes. "Viewed" is kept per account and only GitHub's GraphQL API sets it, which a
# Claude Code cloud session cannot reach, so a session asks for this run instead
# (basstler review-triage mark-viewed falls back to it; request-mark-viewed asks
# directly).
#
# Reusable: a repository calls it from a dispatch-only workflow of its own, which
# basstler review-triage set-up-mark-viewed installs and which passes the token stored
# in its REVIEW_TRIAGE_VIEWER_TOKEN secret.

on:
  workflow_call:
    inputs:
      basstler_branch_or_tag:
        description: "The basstler branch or tag to run, the same one the caller uses this workflow at"
        required: true
        type: string
      pull_request:
        description: "The number of the pull request whose files to mark"
        required: true
        type: string
      repository:
        description: "The owner/name repository the pull request is opened on"
        required: true
        type: string
      started_by_person:
        description: "Whether a person started the run, rather than a pull request event"
        required: false
        default: true
        type: boolean
    secrets:
      viewer_token:
        description: "A token of the account the files are marked viewed for"
        required: true

permissions:
  contents: read

jobs:
  mark:
    name: Mark the mechanical files viewed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The token marks files viewed for its own account, so only the account that
      # started the run may use it; anyone else would mark them for the token's owner.
      # A run a pull request event starts marks them for the owner, as it set up.
      - name: Check the token belongs to whoever started the run
        if: inputs.started_by_person
        env:
          GH_TOKEN: ${{ secrets.viewer_token }}
        run: |
          set -euo pipefail
          OWNER="$(gh api user --jq .login)"
          if [ "$OWNER" != "$GITHUB_ACTOR" ]; then
            echo "::error::The stored token belongs to $OWNER, but $GITHUB_ACTOR started this run; files are marked viewed only for the token's own account."
            exit 1
          fi

      # The triage compares the pull request's commits, so it reads them with history.
      # It checks out the base repository, never the pull request's code, and runs
      # none of it, so a pull_request_target caller is safe.
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          token: ${{ secrets.viewer_token }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install basstler
        run: pip install "basstler @ git+https://github.com/KAOS-repositories/basstler@${{ inputs.basstler_branch_or_tag }}"

      - name: Mark the mechanical files viewed
        env:
          GH_TOKEN: ${{ secrets.viewer_token }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          REPOSITORY: ${{ inputs.repository }}
        run: >-
          python -m basstler review-triage mark-viewed "$PULL_REQUEST"
          --repository "$REPOSITORY" --directly >> "$GITHUB_STEP_SUMMARY"
