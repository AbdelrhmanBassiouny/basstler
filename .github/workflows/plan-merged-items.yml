name: Plan merged items

# Records, on the calling repository's notes branch, every plan item whose pull request
# has merged, and drops the landed items as a plan save does. It checks out the calling
# repository's default branch only to reach its notes remote; it runs none of its code.

on:
  workflow_call:
    inputs:
      basstler_branch_or_tag:
        description: "The basstler branch or tag to run, the same one the caller uses this workflow at"
        required: true
        type: string
      notes_branch:
        description: "The calling repository's notes branch"
        required: true
        type: string

permissions:
  contents: write

jobs:
  record:
    name: Record merged plan items
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install basstler
        run: pip install "basstler @ git+https://github.com/KAOS-repositories/basstler@${{ inputs.basstler_branch_or_tag }}"

      - name: Record merged plan items
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_PERSONAL_NOTES_BRANCH: ${{ inputs.notes_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m basstler.plan.merged_items every-plan
