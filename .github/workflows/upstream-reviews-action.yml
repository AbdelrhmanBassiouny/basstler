name: Upstream reviews (Action branch)

# Answers the request a session pushed on its own branch of a fork, and commits the
# answer onto that same branch; no two requests share a branch or cancel each other.

on:
  workflow_call:
    inputs:
      basstler_branch_or_tag:
        description: "The basstler branch or tag to run, the same one the caller uses this workflow at"
        required: true
        type: string

permissions:
  contents: write

jobs:
  read:
    name: Read the requested upstream pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install basstler
        run: |
          set -euo pipefail
          pip install "basstler @ git+https://github.com/KAOS-repositories/basstler@${{ inputs.basstler_branch_or_tag }}"

      - name: Answer the request onto its branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m basstler.upstream_reviews.action run
