name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest on Python ${{ matrix.python-version }}
    if: github.event_name != 'push' || !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The hook tests run python3 from the path, so the package is installed into the
      # interpreter setup-python put there.
      - name: Install basstler and the test runner
        run: pip install --editable . pytest pytest-xdist

      - name: Run the tests
        run: pytest tests -n auto

  release-version:
    name: The package is the release its version names
    if: github.event_name != 'push' || !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Every tag, since the check compares the version with the latest release.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: basstler

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install basstler
        run: pip install --editable basstler

      # Patch releases are made on merge; a pull request may only name the latest
      # release's version, or its next minor or major one.
      - name: Check the version is one a pull request may name
        run: python -m basstler.release_version check --checkout basstler
