name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  usage:
    name: Actions usage
    if: github.event_name != 'push' || !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      over_budget: ${{ steps.measure.outputs.over_budget }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: basstler

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install basstler
        run: pip install --editable basstler

      # A measurement that fails never blocks the tests: no output reads as within budget.
      - name: Measure the last 24 hours of runs against the budget
        id: measure
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m basstler.actions_usage --repository "${{ github.repository }}" --github-actions

  lint:
    name: ruff
    if: github.event_name != 'push' || !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      # The base commit is checked out next to the change to compare its crossings.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Dependency groups need pip 25.1 or later.
      - name: Install the development tools
        run: |
          python -m pip install --upgrade pip
          pip install --group dev

      - name: Check the code rules
        run: ruff check .

      - name: Check the formatting
        run: ruff format --check .

      - name: Install basstler
        run: pip install --editable .

      # The base is listed with its own code and its own package map, so a crossing that
      # only a change of the map creates is new as well.
      - name: List the base's crossings
        id: base
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASE_COMMIT"
          cd "$RUNNER_TEMP/base"
          if [ ! -f src/basstler/package_map.py ]; then
            echo "::notice::The base declares no package map, so there is nothing to compare."
            exit 0
          fi
          PYTHONPATH=src python -m basstler code-rules crossings "$RUNNER_TEMP/base-crossings.json"
          echo "listed=true" >> "$GITHUB_OUTPUT"

      - name: Fail on a crossing the base does not have
        if: steps.base.outputs.listed == 'true'
        run: python -m basstler code-rules new-crossings "$RUNNER_TEMP/base-crossings.json" --base-commit "$BASE_COMMIT"

  # Past a daily ceiling a pull request's matrix is skipped, unless it carries the
  # budget-override label. A push to main always runs it, since its pass is what releases.
  test:
    name: pytest on Python ${{ matrix.python-version }}
    needs: usage
    if: >-
      (github.event_name != 'push' || !github.event.repository.fork) &&
      (github.event_name == 'push' ||
      needs.usage.outputs.over_budget != 'true' ||
      contains(github.event.pull_request.labels.*.name, 'budget-override'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      # The tags give the installed package its release version, which the tests read.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The hook tests run python3 from the path, so the package is installed into the
      # interpreter setup-python put there.
      - name: Install basstler and the test runner
        run: |
          python -m pip install --upgrade pip
          pip install --editable . --group dev

      # The plan page's script is tested in a headless Chromium.
      - name: Install the browser the page tests run in
        run: python -m playwright install --with-deps chromium

      - name: Run the tests
        run: pytest tests -n auto

