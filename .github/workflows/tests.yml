name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The hook tests run python3 from the path, so the package is installed into the
      # interpreter setup-python put there.
      - name: Install basstler and the test runner
        run: pip install --editable . pytest pytest-xdist

      - name: Run the tests
        run: pytest tests -n auto

  release-version:
    name: The package is the release its version names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Every tag, since the check compares the package with the tag the version names.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: basstler

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install basstler
        run: pip install --editable basstler

      # An installed plugin installs the package at v<version>, so a package change that
      # leaves the version alone never reaches the hooks that call it.
      - name: Check the version was bumped if the package changed
        run: python -m basstler.release_version --checkout basstler
