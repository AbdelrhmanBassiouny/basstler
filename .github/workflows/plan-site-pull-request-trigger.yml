name: Plan site pull request trigger

# A pull request opened, merged, closed, moved in or out of draft or relabelled changes
# what the plan site shows, so it starts the site's build on the default branch, the only
# branch its Pages environment deploys from. pull_request_target runs this file as the
# base branch has it, with a token that can start workflows even for a fork's pull
# request; it never checks out the pull request's code.

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - closed
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled

permissions:
  actions: write

concurrency:
  group: plan-site-pull-request-trigger
  cancel-in-progress: true

jobs:
  dispatch:
    name: Start the plan site build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the plan site build
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run plan-site.yml
          --repo "${{ github.repository }}"
          --ref "${{ github.event.repository.default_branch }}"
