name: Release

# Every change merged to main is released by tagging the merge commit itself, once the
# Tests run on that commit has passed: no file names the version, so nothing is pushed to
# main. The patch is incremented unless a merged pull request is labelled release:minor or
# release:major. A commit whose tests fail is never tagged, so installs stay on the latest
# release that passed; the next commit that passes releases everything merged since.
#
# The same push moves the release branch to the tag. The marketplace serves the plugin
# from that branch, so a synced plugin and the package it installs are one release.

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

env:
  # The branch the marketplace serves the plugin from, always at the latest release.
  RELEASE_BRANCH: release

jobs:
  release:
    name: Release what changed since the latest release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          path: basstler

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install basstler
        run: pip install --editable basstler

      # Every pull request merged since the latest release, so a run a later merge
      # cancelled while it waited still counts its labels.
      - name: Read the merged pull requests
        working-directory: basstler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m basstler.release_version unreleased --checkout . \
            | while read -r commit; do
                gh api "repos/${GITHUB_REPOSITORY}/commits/${commit}/pulls"
              done \
            | jq --slurp 'add // []' > "${RUNNER_TEMP}/pull-requests.json"

      - name: Tag the release
        id: release
        working-directory: basstler
        run: |
          release="$(python -m basstler.release_version release --checkout . \
            --pull-requests "${RUNNER_TEMP}/pull-requests.json")"
          tag="$(printf '%s\n' "${release}" | sed -n 's/^tag=//p')"
          if [ -z "${tag}" ]; then
            echo "Nothing changed since the latest release." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          git tag "${tag}"
          # One atomic push: the plugin never syncs a release the tag does not name yet,
          # and a release behind the branch moves neither.
          git push --atomic --quiet origin "refs/tags/${tag}" "HEAD:refs/heads/${RELEASE_BRANCH}"
          echo "Released ${tag} at $(git rev-parse HEAD)." >> "${GITHUB_STEP_SUMMARY}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Publish the GitHub release
        if: steps.release.outputs.tag != ''
        working-directory: basstler
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release create "${TAG}" --verify-tag --title "${TAG}" --generate-notes
