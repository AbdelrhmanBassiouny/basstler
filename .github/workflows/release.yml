name: Release

# Every change merged to main is released at the version its pull request wrote, which CI's
# release-version check requires to be the next patch, minor or major one. The merged commit
# is tagged and published as a GitHub release; nothing is pushed to main, so the merge a
# plugin syncs from already names the release it installs.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release what changed since the latest release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: basstler

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install basstler
        run: pip install --editable basstler

      # The commit this run was started for, which the merged pull request already
      # bumped: tagging it never pushes to main, so a plugin syncs the version from the
      # merge itself.
      - name: Tag the release
        id: release
        working-directory: basstler
        run: |
          release="$(python -m basstler.release_version release --checkout .)"
          tag="$(printf '%s\n' "${release}" | sed -n 's/^tag=//p')"
          if [ -z "${tag}" ]; then
            echo "Nothing changed since the latest release." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          git tag "${tag}"
          git push --quiet origin "refs/tags/${tag}"
          echo "Released ${tag} at $(git rev-parse HEAD)." >> "${GITHUB_STEP_SUMMARY}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Publish the GitHub release
        if: steps.release.outputs.tag != ''
        working-directory: basstler
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release create "${TAG}" --verify-tag --title "${TAG}" --generate-notes
