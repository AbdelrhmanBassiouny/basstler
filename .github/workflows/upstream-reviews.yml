name: Upstream reviews

# Reports the checks and review threads a fork branch's upstream pull request has
# collected, and on request the log behind each check that failed.
#
# Thread resolved-state is only exposed by GitHub's GraphQL API, and a Claude session
# reaches neither that nor the upstream's REST API at all, so both reads happen on a
# runner and the session reads the job's log.
#
# Reusable: a project calls it from a dispatch-only workflow of its own (see
# docs/SETUP.md), naming the release of basstler it calls. The upstream comes from the
# project's own .claude/basstler/stack.toml and the fork owner from the runner's
# context, so no repository is named here.
#
# A runner starts with nothing installed and no session hook runs on it, so this job
# installs the package itself before invoking a module.

on:
  workflow_call:
    inputs:
      basstler_ref:
        description: "The basstler branch or tag to run, the same one the caller uses this workflow at"
        required: true
        type: string
      pull_request:
        description: "Upstream pull request number (takes precedence over branch)"
        required: false
        type: string
      branch:
        description: "Fork branch whose upstream pull request to read"
        required: false
        type: string
      include_resolved:
        description: "Include threads already marked resolved"
        required: false
        default: false
        type: boolean
      failure_logs:
        description: "Quote the log behind each check that failed"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  report:
    name: Report the upstream pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install basstler
        run: |
          set -euo pipefail
          pip install "basstler @ git+https://github.com/AbdelrhmanBassiouny/basstler@${{ inputs.basstler_ref }}"

      - name: Read the upstream pull request
        env:
          # gh is preinstalled on the runner; this is the only credential it needs,
          # and read-only is all the job is granted.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          ARGUMENTS=()
          if [ -n "${{ inputs.pull_request }}" ]; then
            ARGUMENTS+=(--pull-request "${{ inputs.pull_request }}")
          elif [ -n "${{ inputs.branch }}" ]; then
            ARGUMENTS+=(--branch "${{ inputs.branch }}")
          else
            echo "Provide either pull_request or branch." >&2
            exit 2
          fi
          if [ "${{ inputs.include_resolved }}" = "true" ]; then
            ARGUMENTS+=(--include-resolved)
          fi
          if [ "${{ inputs.failure_logs }}" = "true" ]; then
            ARGUMENTS+=(--failure-logs)
          fi
          python -m basstler.upstream_reviews "${ARGUMENTS[@]}"
