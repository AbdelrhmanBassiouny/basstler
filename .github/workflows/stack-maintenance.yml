name: Stack maintenance

# Runs one unattended maintenance pass on the calling fork: reparent, fast-forward,
# restack and promote. A branch whose owner was told on its pull request does not fail
# the job. Called from a project's own workflow; see docs/examples/stack-maintenance.yml.

on:
  workflow_call:
    inputs:
      basstler_branch_or_tag:
        description: "The basstler branch or tag to run, the same one the caller uses this workflow at"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  maintain:
    name: Run the maintenance pass
    # A pull request from another fork gets a read-only token.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      # A pass pushes; a superseded run waits rather than being cancelled mid-push.
      group: stack-maintenance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install basstler
        run: |
          set -euo pipefail
          pip install "basstler @ git+https://github.com/AbdelrhmanBassiouny/basstler@${{ inputs.basstler_branch_or_tag }}"

      - name: Resolve the upstream remote
        run: |
          set -euo pipefail
          SETUP_COMMAND="$(python -m basstler.stack configuration \
            | awk -F'\t' '$1 == "upstream_setup_command" { print $2 }')"
          if [ -n "${SETUP_COMMAND}" ]; then
            eval "${SETUP_COMMAND}"
          fi

      - name: Run the maintenance pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          # The pass consumes board.json, so every run exports a fresh one first.
          python -m basstler.maintenance board --write
          REPORT="${RUNNER_TEMP}/maintenance-report.json"
          STATUS=0
          python -m basstler.maintenance run-unattended > "${REPORT}" || STATUS=$?
          cat "${REPORT}"
          {
            echo '### Maintenance pass'
            echo '```json'
            cat "${REPORT}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${STATUS}"
