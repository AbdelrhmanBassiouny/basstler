repos:
  - repo: local
    hooks:
      - id: format-python
        name: Format Python (black, then docformatter where it doesn't conflict with black)
        description: >
          Runs black, then docformatter on top of it, keeping docformatter's
          docstring changes only when a subsequent black pass leaves them
          unchanged. See scripts/format_docstrings.py for why.
        entry: python scripts/format_docstrings.py
        language: python
        additional_dependencies: ["black==25.11.0", "docformatter==1.7.8", "tqdm"]
        files: \.py$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
