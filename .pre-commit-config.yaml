repos:
  - repo: local
    hooks:
      - id: format-python
        name: Format Python (ruff, then docformatter where it doesn't conflict with ruff)
        description: >
          Runs ruff format, then docformatter on top of it, keeping docformatter's
          docstring changes only when a subsequent ruff pass leaves them
          unchanged. See scripts/format_docstrings.py for why.
        entry: python scripts/format_docstrings.py
        language: python
        additional_dependencies: ["ruff==0.17.3", "docformatter==1.7.8", "tqdm"]
        files: \.py$
      - id: code-rules
        name: Check the code the staged change touches against the rules
        description: >
          Fails when code the staged change touches breaks a rule a checker in
          src/basstler/code_rules enforces, such as a missing or overlong docstring.
        entry: env PYTHONPATH=src .venv/bin/python -m basstler code-rules check
        language: unsupported
        files: \.py$
        exclude: ^tests/dataset/
      - id: agents-md
        name: Generate AGENTS.md from the rules
        description: >
          Rewrites AGENTS.md from the sections in src/basstler/code_rules/rules.
        entry: env PYTHONPATH=src .venv/bin/python -m basstler code-rules agents-md
        language: unsupported
        pass_filenames: false
        always_run: true
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
