# Copy into a project as .github/workflows/upstream-reviews.yml, so the
# /upstream-reviews skill can dispatch it there. Both references below follow
# basstler's main branch; to pin a release instead, change both to its tag.
name: Upstream reviews

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: "Upstream pull request number (takes precedence over branch)"
        required: false
        type: string
      branch:
        description: "Fork branch whose upstream pull request to read"
        required: false
        type: string
      include_resolved:
        description: "Include threads already marked resolved"
        required: false
        default: false
        type: boolean
      failure_logs:
        description: "Quote the log behind each check that failed"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  report:
    uses: AbdelrhmanBassiouny/basstler/.github/workflows/upstream-reviews.yml@main
    with:
      basstler_ref: main
      pull_request: ${{ inputs.pull_request }}
      branch: ${{ inputs.branch }}
      include_resolved: ${{ inputs.include_resolved }}
      failure_logs: ${{ inputs.failure_logs }}
