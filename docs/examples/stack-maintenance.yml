# Copy into a fork project as .github/workflows/stack-maintenance.yml to run a
# maintenance pass in the project's own Actions whenever the stack can have changed.
# Event triggers only: the Actions budget allows no schedule. Both references below
# follow basstler's main branch; to pin a release instead, change both to its tag.
name: Stack maintenance

on:
  pull_request:
    types: [opened, ready_for_review, closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  maintain:
    uses: AbdelrhmanBassiouny/basstler/.github/workflows/stack-maintenance.yml@main
    with:
      basstler_branch_or_tag: main
