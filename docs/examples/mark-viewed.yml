# Copy into the repository whose Actions mark files viewed for you - your fork, or the
# repository itself when you work on its branches - as .github/workflows/mark-viewed.yml
# on its default branch, and store your token as its REVIEW_TRIAGE_VIEWER_TOKEN secret
# (docs/SETUP.md says which token). Both references below follow basstler's main branch;
# to pin a release instead, change both to its tag.
name: Mark viewed

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: "The number of the pull request whose mechanical files to mark viewed"
        required: true
        type: string
      repository:
        description: "The owner/name repository the pull request is opened on"
        required: true
        type: string

permissions:
  contents: read

jobs:
  mark:
    uses: KAOS-repositories/basstler/.github/workflows/review-triage-mark-viewed.yml@main
    with:
      basstler_branch_or_tag: main
      pull_request: ${{ inputs.pull_request }}
      repository: ${{ inputs.repository }}
    secrets:
      viewer_token: ${{ secrets.REVIEW_TRIAGE_VIEWER_TOKEN }}
