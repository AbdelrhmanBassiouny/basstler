schema_version: 1
id: basstler-packages
title: 'basstler packages: basstler-* distributions with one lockstep version and a playbook model'
description: Split basstler into acyclic basstler-* PyPI distributions under the basstler.<part> namespace, released
  together at one version with exact sibling pins. Then a dataclass playbook model, with settings, a write guard,
  report sections and an item lifecycle set up through a guided init, lets anyone depend on basstler and compose
  their own workflow on top of a default one, and code_rules catches up with krrood's development tools. The reorganization
  goes first.
default_repository: AbdelrhmanBassiouny/basstler
tracking_issue: 151
waves:
- id: reorganization
  name: Reorganization
  description: Acyclic distributions, a uv workspace and lockstep PyPI releases; every in-flight item rebases onto it.
- id: extensibility
  name: Extensibility
  description: The playbook model, krrood's latest development tools and the customization guide.
tracks:
- id: package-split
  name: Package split and release
  wave: reorganization
- id: playbook
  name: Playbook model
  wave: extensibility
- id: rules
  name: Code rules from krrood
  wave: extensibility
items:
- id: package-map
  title: Declare the distributions and their layers, and check imports against them
  track: package-split
  branch: claude/loving-gauss-7g1xt6
  pull_request_number: 154
  depends_on: []
  status: in progress
  session: https://claude.ai/code/session_018wfiv7Bw3TgQiQbiuneZDr
  notes: >
    Implemented in draft #154: basstler.package_map (Layer, Distribution, PACKAGE_MAP) and
    PackageBoundaryChecker on "a package imports only the basstler packages its pyproject lists",
    with a 22-crossing baseline (code_rules/known-boundary-crossings.yaml) a test keeps exact. Next:
    review of the module placement and dependency lists. Module paths never change.
- id: git-and-github-domain
  title: Extract basstler.git and gather the GitHub domain model into basstler.github
  track: package-split
  depends_on:
  - package-map
  status: not started
  notes: 'GitCommandRunner, GitCommandFailed, branch, remote_branch, commit_move into basstler.git. Into
    basstler.github: repository, github_labels, pull_request_state, pull_request_source, maintenance github/board
    record/description/constants, ExternalCallFailed, upstream_reviews REST/GraphQL models, vocabulary
    and queries, actions usage/budget, workflows, release_version. Removes github->maintenance and environment->github.
    Pure moves. GitHubClient (#123, merged) is already in github/client.py.'
- id: break-remaining-cycles
  title: Break the remaining cycles and give each distribution its own locations, environment and exceptions
  track: package-split
  depends_on:
  - git-and-github-domain
  status: not started
  notes: Plan, Item, Track, Wave models from plan_site/plan.py into basstler.plan; the part of stack.configuration
    upstream_reviews reads into github; maintenance->upstream_reviews.action inverted so only stack depends
    on reviews; plugin_root into core, since core's shell_configuration imports it (#76 touches it). Split
    locations, environment and exceptions per distribution, the project rule becoming "once, in its own
    package's locations". The boundary checker then fails CI with an empty baseline.
- id: uv-workspace
  title: Move each distribution into packages/<name> as a uv workspace with lockstep versions
  track: package-split
  depends_on:
  - break-remaining-cycles
  status: not started
  notes: Pure-rename move (git diff -M shows only renames plus pyproject files). hatch-vcs per package
    with root ../..; a custom hatch metadata hook, force-included in each sdist, pins siblings ==version.
    Committed uv.lock and uv sync --frozen at session start (absorbs basstler-reliability/locked-install).
    package_layout reads importlib.metadata. CI installs each package alone and runs its tests, every
    package on each change (#55's change-based selection closed unmerged). release:major.
- id: pypi-release
  title: Publish every distribution to PyPI on each release with trusted publishing
  track: package-split
  depends_on:
  - uv-workspace
  status: not started
  notes: After release.yml tags, uv build --all-packages and pypa/gh-action-pypi-publish via OIDC (no token); every
    package every release, TestPyPI first. The owner registers a pending trusted publisher per name on PyPI and
    TestPyPI. Session start installs basstler==<plugin release> from PyPI, editable from the workspace in a clone;
    pip install keeps working without uv (windows-support). release:minor. When PyPI is unreachable, session start
    installs from a pinned git source instead, and switches to a new runtime only once its hooks and commands load.
- id: playbook-model
  title: A Playbook dataclass model that every distribution contributes commands, skills, hooks and rules
    to
  track: playbook
  depends_on:
  - uv-workspace
  status: not started
  notes: 'basstler.playbook in core: component kinds CommandGroup, SkillDefinition, HookDefinition, McpTool,
    ActionsWorkflow, Ruleset[RuleKind], SitePanel (hub tab or sidebar), ItemAttribute (typed item fields
    basstler-plan validates without depending on their owner), and the existing SetupStep, whose SetupChecklist
    moves to core so each distribution contributes its own steps. PackageContribution via basstler.contributions
    entry points; Playbook.without/with_components; DefaultPlaybook; a root basstler_playbook. skills
    build --check. release:minor.'
- id: krrood-sync
  title: Bring code_rules up to krrood's latest development tools, with credit
  track: rules
  depends_on:
  - uv-workspace
  status: not started
  notes: 'From krrood@be69c37d: one module per top-level section, project rules in a root agent_rules
    package, checker as a rule''s third element with Section.checkers and check --all-lines, ImportsRules,
    SerializationRules, ErrorsRules->ExceptionModellingRules, leading-preposition and name-completion
    checkers, a format subcommand replacing scripts/format_docstrings.py, .pre-commit-hooks.yaml, RepositoryInstructionsFile.
    Cite krrood and update NOTICE. Ask before copying FieldAccessorDefinitionChecker. release:minor.'
- id: customization-docs
  title: A README per distribution and a guide to writing your own playbook and ruleset
  track: playbook
  depends_on:
  - playbook-model
  - krrood-sync
  - pypi-release
  - playbook-setup-wizard
  - item-lifecycle
  status: not started
  notes: 'A README per distribution: what it holds, depends on, and how to install it alone. The guide''s worked
    example is the owner''s own playbook adding basstler-recommender (work-recommender) to DefaultPlaybook, with
    its SitePanel and ItemAttribute components, then dropping a contribution and adding a ruleset of code or plan
    rules.'

- id: extension-points
  title: Open vocabularies, one interface per GitHub capability, and shipped test doubles
  track: playbook
  depends_on:
  - uv-workspace
  status: not started
  notes: Labels (with description and colour), discussion categories and item stages become base classes a user's
    own enum extends. basstler.github gets one small abstract interface per capability (read pull requests, write
    labels, comment, read stacks, read workflows) that GitHubRestClient implements. basstler.github.testing ships
    a recording and replaying client plus fixtures. A general Actions relay for API calls a cloud proxy refuses,
    generalizing the upstream-reviews route. release:minor.

- id: playbook-settings
  title: A typed settings model for every value a workflow may differ in
  track: playbook
  depends_on:
  - playbook-model
  status: not started
  notes: Owners whose repositories may be written to, notes branch and its place (per repository or central), merge
    or rebase, force-push allowed or never, GitHub-native stacks or basstler restacking, commit attribution policy,
    protected branches, command name. Defaults equal today's behaviour; no owner, branch name or label is hardcoded
    outside it. release:minor.

- id: write-guard
  title: 'basstler-guard: hooks generated from the playbook that enforce its write rules'
  track: playbook
  depends_on:
  - playbook-settings
  - extension-points
  status: not started
  notes: 'New opt-in distribution basstler-guard (git, github), in DefaultPlaybook. Every CommandGroup command declares
    who may run it: the session alone, the session when told, or only the person. Generates a PreToolUse guard denying
    direct git and GitHub writes (falling back to the standard library when the runtime is broken), a pre-push hook,
    and auto-approval of the commands a session may run alone. release:minor.'

- id: session-report-sections
  title: Session start as a list of report sections a playbook composes
  track: playbook
  depends_on:
  - playbook-model
  status: not started
  notes: 'SessionReportSection component kind: each section reports that something holds (CI red, conflict, threads
    waiting, stale base), never the detail, and fails alone and visibly. Today''s session-start messages become
    the default sections. release:minor.'

- id: item-lifecycle
  title: Work-item stages, transitions and who may make them
  track: playbook
  depends_on:
  - playbook-model
  - basstler-v3-plans/plan-store-issues
  status: not started
  notes: 'An ItemLifecycle model: stages, allowed transitions and whether a session or only the person makes each,
    with labels from extension-points. Default lifecycle equals today''s item statuses; an issue-backed one reads
    stages from labels through the PlanStore. Item priority and a proof (a failing test the code runs itself) as
    ItemAttribute components. release:minor.'

- id: playbook-setup-wizard
  title: 'basstler init: guided setup with recommended choices that writes the user''s playbook'
  track: playbook
  depends_on:
  - playbook-settings
  - write-guard
  - session-report-sections
  status: not started
  notes: 'A few questions, the recommended choice first, each answer becoming a playbook setting; writes the repository''s
    basstler_playbook and verifies every step. Never changes repository settings: detects issues, Discussions, Actions
    or branch auto-delete being off and gives the link to turn them on. Builds on basstler-setup-ux''s checklist.
    release:minor.'
