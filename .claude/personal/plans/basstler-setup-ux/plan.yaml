schema_version: 1
id: basstler-setup-ux
title: Smoother basstler setup
description: The setup session for a fork asked many questions and ended with plan_site unverified
  although the clone's own dispatch run succeeded. The check judges every repository on the
  site as one row, cannot tell an unreadable repository from a fault, and leaves steps to
  the user that the tooling could do. This plan makes the status per repository, treats a
  successful run as proof, and removes avoidable questions and steps.
default_repository: KAOS-repositories/basstler
waves:
- id: reporting
  name: Report status truthfully
  description: Per-repository rows and proof by run, so a working setup is not reported as
    unverified.
- id: fewer-steps
  name: Fewer questions and steps
  description: Remove answers and manual steps the tooling can settle itself.
- id: research
  name: Research
  description: Analysis and a prototype only; no production change until the user decides.
tracks:
- id: status
  name: plan_site status reporting
  wave: reporting
- id: setup-flow
  name: Setup flow
  wave: fewer-steps
- id: token-free
  name: Token-free publishing
  wave: research
items:
- id: run-as-proof
  title: A successful run after the last config change counts as proof
  track: status
  depends_on: []
  status: not started
  notes: Judge by the latest run after the last configuration change, not by failure counts.
    A 403 on the secrets endpoint or an unreadable other repository must not leave the row
    unverified; separate "cannot read from this environment" from "unverified".
- id: short-summary
  title: One-line plan_site in the session-start summary
  track: status
  depends_on: []
  status: not started
  notes: Details move to the skill; no raw 403 JSON in the summary.
- id: fewer-questions
  title: Reuse the recorded site repository and name needed attachments up front
  track: setup-flow
  status: not started
  notes: 'Do not ask when the notes branch records the site repository. State which repositories
    need add_repo and with what access before asking; the session attached stack-board with
    push access and never needed it. From Hesham87/Platform_maintainer: the Claude App must
    be installed on the site repository, and add_repo fails while it is private; name both
    up front.'
- id: trigger-and-done
  title: Start the site build without a no-op push and print done
  track: setup-flow
  depends_on:
  - run-as-proof
  status: not started
  notes: The dispatch workflow already accepts workflow_dispatch. Add a --trigger option on
    plan_site.publication that starts the site workflow and reports the result. Once a run
    succeeded, print done instead of repeating the token steps.
- id: one-call-labels
  title: List missing labels in one call
  track: setup-flow
  status: not started
  notes: setup.steps lists missing labels, or a cached list is used, when the session has
    no token, instead of one get_label call per label. An invalid GH_TOKEN made setup skip
    its owner and label checks silently (main-red went unnoticed); report them unchecked.
- id: retry-dispatch-step
  title: Retry the gh workflow run step of the dispatch workflow
  track: setup-flow
  status: not started
  notes: Dispatch run 76 failed with a 502 from gh workflow run, so a notes push started no
    build. Retry the step with a growing wait in templates/plan_site_dispatch_workflow.yml.
    test_publication.py pins the step's command and must change with it; deployed workflows
    are rewritten at the next setup run.
- id: fork-issues
  title: Setup turns on Issues in the fork, or says how
  branch: null
  track: setup-flow
  notes: 'GitHub starts forks with Issues off, and plan tracking issues need them; no setup
    step said so. Add a ForkIssues SetupStep beside ForkActions in setup/steps.py, in SetupChecklist.for_clone:
    read has_issues, set it with gh api -X PATCH repos/<fork> -f has_issues=true, and print
    the browser step (Settings > General > Features > Issues) only if that is refused. A check-setup.sh
    row reports a fork with Issues off as needs-setup; plan-create step 5''s 410 fallback
    names this step.

    '
  depends_on: []
  status: not started
- id: gh-prerequisite
  title: Every printed gh line comes after the steps to install and log in to gh
  branch: null
  track: setup-flow
  notes: 'Printed gh lines (gh label create in ForkLabels, gh repo create, gh api .../pages
    and gh secret set in plan_site/user_steps.py) assume gh is installed and logged in. Print
    one prerequisite block ahead of the first gh line in both SetupChecklist.render and UserSteps:
    install with apt (the GitHub CLI apt repository where the distribution''s package is too
    old), then gh auth login. Leave it out when gh auth status already succeeds.

    '
  depends_on: []
  status: not started
- id: try-before-instructing
  title: With a logged-in gh, setup takes every step itself and prints only the ones that
    failed
  branch: null
  track: setup-flow
  notes: 'Depends on gh-prerequisite and fork-issues. In a local session with gh installed
    and logged in, setup runs every step it can itself (labels, Issues, Actions, site repository,
    Pages, storing the secret from a token the user gives) and prints one deterministic report
    of each step done or failed with its reason; manual instructions appear only for failed
    steps, extending PendingStep.failure ("Could not be done automatically") to SetupStep.
    Token creation stays manual: GitHub offers no command for it. Related to one-call-labels
    and trigger-and-done.

    '
  depends_on:
  - gh-prerequisite
  - fork-issues
  status: not started
- id: build-failure-report
  title: Report the plan site's failed builds, with GitHub's reason, where the user sees them
  track: status
  depends_on:
  - run-as-proof
  - basstler-packages/uv-workspace
  status: not started
  session: https://claude.ai/code/session_018wfiv8ntWsdS2nU92PrJbr
  notes: 'On 2026-11-07, eleven plan saves printed "Started the plan site build" while every
    run failed in 2 s with no step run: GitHub locked the account over billing, shown only
    as a run annotation. Without polling: the session-start summary and the setup check read
    the site''s latest run, and a failure shows its annotations (check-runs annotations API),
    e.g. the billing lock and the settings page that fixes it. A build start says it started
    a run, never that the site is updated.'
- id: unreadable-repository-items
  title: Plan site renders items whose repository it cannot read, instead of failing the whole
    site
  track: status
  depends_on: []
  status: not started
  notes: 'From #153 (tomsch420) and #170''s review: one repository the build cannot read (a
    404 listing a private repository''s pull requests) fails every plan on the site. Render
    those items without live state, with a visible note naming the repository and the PLAN_SITE_READ_TOKEN
    fix, so the rest of the site still builds. A bug fix, so the uv-workspace freeze exempts
    it; stacked on #170, whose PLAN_SITE_READ_TOKEN the note names.'
- id: visibility-before-site-repository
  title: Publication checks private repositories before asking for the site repository
  track: setup-flow
  depends_on: []
  status: not started
  session: https://claude.ai/code/session_018wfiv7jmDwVqQj2xLpXnwJ
  notes: 'From Hesham87/Platform_maintainer: publish() asks to create the site repository
    before its private-repository check, so a private repository learns about PLAN_SITE_READ_TOKEN
    and the public site only after creating it, making it public and installing the App. Run
    the check, and its public-site warning, before CREATE_SITE_REPOSITORY. Own bug PR off
    main, failing test first.'
- id: unreachable-site-repository
  title: Publication tells an unreachable site repository from a missing one
  track: setup-flow
  depends_on: []
  status: not started
  session: https://claude.ai/code/session_018wfiv7jmDwVqQj2xLpXnwJ
  notes: 'From Hesham87/Platform_maintainer: default_branch_of() returns None whenever git
    ls-remote fails, and publish() reads that as missing, so a private or unattached site
    repository got create-the-repository again. Read the repository through the API (404 vs
    refused) and name the reason: private, not attached, App not installed. Own bug PR off
    main, failing test first.'
- id: merge-workflow-branch-history
  title: The merge workflow branch starts from the default branch, so its pull request can
    open
  track: setup-flow
  depends_on: []
  status: not started
  session: https://claude.ai/code/session_018wfiv7jmDwVqQj2xLpXnwJ
  notes: 'From Hesham87/Platform_maintainer: write_merge_workflow writes basstler/plan-site-merge
    as a new RemoteBranch with no parent, so GitHub refused the pull request (422, no history
    in common with main) and the printed gh pr create fallback fails the same way. Branch
    from the default branch''s head. Own bug PR off main, failing test first.'
- id: merge-workflow-draft
  title: The merge workflow pull request opens as a draft
  track: setup-flow
  depends_on: []
  status: not started
  session: https://claude.ai/code/session_018wfiv7jmDwVqQj2xLpXnwJ
  notes: 'From Hesham87/Platform_maintainer: MergeWorkflowProposal opens its pull request
    with draft=False (user_steps.py), against repositories whose rules open every pull request
    as a draft. Open it as a draft. Undecided (ask the owner): its pull_request_target trigger
    fails a product''s zizmor dangerous-triggers check and its docs rule for workflow changes;
    make the merge workflow optional, or name the exception. Own bug PR off main.'
tracking_issue: 135
