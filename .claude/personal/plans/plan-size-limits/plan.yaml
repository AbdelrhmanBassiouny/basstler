schema_version: 1
id: plan-size-limits
title: Plans and roadmaps stay small, enforced by tooling
description: Make plan size a property the tooling holds rather than one sessions have to
  remember. A hard budget covers a plan's plan.yaml and roadmap.md together; save-plan.sh
  refuses a save that breaks it; /plan-create and /add-plan-item read the budget and open
  a new plan instead of growing a full one; and the roadmap-writing guidance across the plan
  skills stops asking for detail the budget cannot afford. Because the budget is enforced
  by refusal, the two plans already over it are split first.
default_repository: AbdelrhmanBassiouny/basstler
tracking_issue: 37
waves:
- id: budget
  name: Wave 1 - the budget, measured
  description: 'The budget exists and every plan can be measured against it, but nothing is
    refused yet. Report-only, so no plan is stranded while the migration below is still outstanding.

    '
- id: migration
  name: Wave 2 - split the plans already over it
  description: 'The two oversized plans come under budget. This must land before any refusal,
    or their own state becomes unsaveable mid-flight.

    '
- id: enforcement
  name: Wave 3 - refusal and the skills
  description: 'The gate starts refusing, and the skills that write plans learn to route new
    work elsewhere and to write less.

    '
tracks:
- id: budget-measurement
  name: The budget and its report
  wave: budget
- id: plan-splits
  name: Splitting the oversized plans
  wave: migration
- id: gate-and-skills
  name: The save gate and the writing skills
  wave: enforcement
items:
