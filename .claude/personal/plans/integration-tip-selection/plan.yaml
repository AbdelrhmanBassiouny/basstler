schema_version: 1
id: integration-tip-selection
title: Which tips the integration build takes, and what it says about the rest
description: The integration build's selection step, split out of stack-maintenance once that
  plan reached its size budget. Which of two colliding tips a build keeps, decided by what
  a branch is rather than by which pull request happened to number lower; a tip refused outright
  when merging it would take the build's own pipeline out of the tree; and a comment on every
  branch a build left out, so the reason is readable instead of being rediscovered days later.
default_repository: AbdelrhmanBassiouny/basstler
tracking_issue: 4
waves:
- id: selection
  name: The selection step
  description: 'One phase. All four items are already in flight on top of the integration
    branch itself, so nothing here waits on a wave boundary - the ordering that exists is
    stacking, in depends_on.

    '
tracks:
- id: tips
  name: Which tips a build takes
  wave: selection
  description: The order they are tried in, what decides that order, and the one a build declines
    to merge at all.
- id: reports
  name: What a build says about the rest
  wave: selection
  description: What a branch's owner is told when a build leaves that branch out.
