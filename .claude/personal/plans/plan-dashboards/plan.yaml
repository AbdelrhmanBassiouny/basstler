- id: shared-pr-state-chips
  title: 'PR 3: shared pull_request_state module + LOC/CI/conflict chips in plan dashboards'
  branch: null
  pull_request_number: null
  status: not_started
  track: live-state
  depends_on: []
  notes: >-
    One pull-request-state module (CI rollup, lines changed, mergeable probe, session link)
    shared by stack.py and the dashboard, plus LOC/CI/conflict chips and a stack chip on
