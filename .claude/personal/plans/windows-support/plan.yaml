schema_version: 1
id: windows-support
title: basstler sets up and runs on Windows
description: Fix what stopped /setup-personal-notes on Windows (Git Bash, python.org Python,
  WSL with no usable distribution) - bare bash resolving to WSL's launcher, the environment
  interpreter path, crashes on a failed check-setup.sh, an unset plugin root, a partial setup
  after a failed run - then keep it fixed with a Windows CI job.
default_repository: KAOS-repositories/basstler
tracking_issue: 70
waves:
- id: fixes
  name: Windows fixes
tracks:
- id: fixes
  name: Windows bug fixes
  wave: fixes
items:
- id: windows-interpreter-candidates
  title: Create the package environment on Windows without uv
  branch: null
  status: not started
  track: fixes
  depends_on:
  - basstler-packages/uv-workspace
  pull_request_number: null
  notes: 'Re-check once basstler-packages/uv-workspace (uv sync --frozen at session start)
    lands: if every install runs through uv, drop this. BASSTLER_INTERPRETER_CANDIDATES names
    python3.14/3.13/3.12, which Windows does not install, so without uv on PATH create_basstler_environment
    always falls back to installing uv with pip. Also try py -3.14/-3.13/-3.12 (and a python
    on PATH checked against BASSTLER_PYTHON_REQUIREMENT), each resolved to a full path before
    it runs. Split out of windows-environment-interpreter as its own root cause.'
- id: setup-no-partial-writes
  title: Check setup before writing the notes remote to git config
  branch: null
  status: not started
  track: fixes
  depends_on: []
  pull_request_number: null
  notes: PersonalNotesSetup.run writes claude.personalNotesRemote before the first check,
    so every failed run leaves it set. Run and validate the first check before any write,
    or name what was changed in the failure.
- id: setup-skill-windows-guidance
  title: 'Setup skill: install the package before step 5, and say when ownership cannot be
