schema_version: 1
id: stack-maintenance
title: 'The maintenance pass and the integration branch: running a stack of pull requests'
description: 'What keeps a stack of pull requests moving without a person driving each step:
  a deterministic executor that fast-forwards, restacks, promotes and reports; reparenting
  a child whose parent has landed; reading upstream review threads from a fork; and a regenerated
  integration branch that answers whether the in-flight branches actually coexist.'
default_repository: AbdelrhmanBassiouny/basstler
tracking_issue: 40
waves:
- id: pass
  name: The maintenance pass
  description: The executor, what it decides for itself, and the version of itself it runs.
- id: integration
  name: The integration branch
  description: A branch regenerated from upstream plus every reviewed tip, built to be worked
    from rather than merged out of, and judged by real CI.
tracks:
- id: pass
  name: Maintenance pass
  wave: pass
- id: integration
  name: Integration branch
  wave: integration
