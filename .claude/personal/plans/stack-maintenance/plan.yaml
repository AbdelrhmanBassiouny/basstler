schema_version: 1
id: stack-maintenance
title: 'The maintenance pass: running a stack of pull requests'
description: 'What keeps a stack of pull requests moving without a person driving each step:
  a deterministic executor that fast-forwards, restacks, promotes and reports, and the manifest
  kept current at every transition. The integration branch was retired with the carryover
  (basstler#19, #28, #29).'
default_repository: AbdelrhmanBassiouny/basstler
tracking_issue: 40
waves:
- id: pass
  name: The maintenance pass
  description: The executor, what it decides for itself, and the version of itself it runs.
tracks:
- id: pass
  name: Maintenance pass
  wave: pass
items:
- id: manifest-currency-first
  title: Write the manifest and republish the dashboard before anything else, at every transition
  branch: claude/plan-manifest-update-priority-ex2zst
  pull_request_number: 48
  status: in_progress
  session: https://claude.ai/code/session_01VWwD8nsdKr9wHaRgN1J2du
  track: pass
  blockers: []
  depends_on: []
  notes: >
    Every skill that can affect a plan writes the manifest at each transition and republishes the
    dashboard once per turn, citing manifest-staleness.md by a relative link; adds item_bootstrap's
    update, check, resolve, block and unblock, and fixes the manifest writer's multi-line-value
    corruption. Draft #48 (from CRAM #151); every 25 Oct review thread addressed through 3d9609f.
    Follow-ups: dashboard-token-economy, and plan-tracking-skills/skill-document-links for the older
    ${..._DOCUMENT} references. Absorbs CRAM #160's indent fix.
- id: promotion-summaries-and-table
  title: Promote with a written summary, and send no notification
  branch: null
  pull_request_number: null
  status: not_started
  track: pass
  depends_on: []
  notes: 'The script builds the compare-and-create link; the upstream pull request opens with
    a title and a point-based summary linking back to the fork pull request; nothing sends
