schema_version: 1
id: stack-maintenance
title: 'The maintenance pass: running a stack of pull requests'
description: 'What keeps a stack of pull requests moving without a person driving each step: a deterministic
  executor that fast-forwards, restacks, promotes and reports, and the manifest kept current at every
  transition. The integration branch was retired with the carryover (basstler#19, #28, #29).'
default_repository: AbdelrhmanBassiouny/basstler
tracking_issue: 40
waves:
- id: pass
  name: The maintenance pass
  description: The executor, what it decides for itself, and the version of itself it runs.
tracks:
- id: pass
  name: Maintenance pass
  wave: pass
items:
- id: manifest-currency-first
  title: Write the manifest and republish the dashboard before anything else, at every transition
  branch: claude/plan-manifest-update-priority-ex2zst
  pull_request_number: 48
  status: in_progress
  session: https://claude.ai/code/session_01Rm1Xa8ujsXWBai4U8v6ThY
  track: pass
  blockers: []
  depends_on: []
  notes: 'Every skill that can affect a plan writes the manifest and republishes the dashboard first,
    at every point that makes a recorded field stale; also fixes the manifest writer''s corruption bugs
    and carries plan-tracking-skills'' indent fix. Draft #48, carried from CRAM #151 with its history;
    main is not merged in yet (conflicts listed on the pull request). Absorbs plan-tracking-skills'' plan-item-bootstrap-yaml-indent
    (CRAM #160): when #48 lands, check that the item indent is read off the manifest.'
- id: promotion-summaries-and-table
  title: Promote with a written summary, and send no notification
  branch: null
  pull_request_number: null
  status: not_started
  track: pass
  depends_on: []
  notes: 'The script builds the compare-and-create link; the upstream pull request opens with a title
    and a point-based summary linking back to the fork pull request; nothing sends a notification. The
    session table of links moved to finish-summary-markdown. Not started here: CRAM #162''s bastler/-era
    branch is retired in #50, whose last commit is the reference.'
- id: stack-state-from-github
  title: Derive in-review and CI from GitHub instead of hand-kept labels
  branch: null
  pull_request_number: null
  status: not_started
  track: pass
  depends_on: []
  notes: 'Raised in review on basstler#15. The board export records each fork pull request''s open upstream
    pull request and its head''s check verdict (RollupState via CheckStatus.over), replacing the never-filled
    ci field; in-review is derived from the upstream pull request and the pass keeps the in-review label
    in sync; status shows CI and promotion withholds failing branches. Based on main: #15, which split
    stack_model.py out of stack.py, has merged. Three #15 threads point here.'
- id: pass-commit-graph
  title: Write a commit-graph at the start of a pass, measured against a profiled baseline
  branch: null
  pull_request_number: null
  status: not_started
  track: pass
  depends_on: []
  notes: A CRAM pass (133 PRs) took about 6 min; stack check spent 8.3 s on 133 merge-base --is-ancestor
    calls (about 60 ms each) in a shallow clone with no commit-graph. Run git commit-graph write --reachable
    at pass start. First profile a full run-report with GIT_TRACE2 and put the before/after numbers in
    the PR; the baseline is what the later performance items measure against.
- id: landed-predicate-once
  title: Compute the landed predicate once per run and hand it to every phase
  branch: null
  pull_request_number: null
  status: not_started
  track: pass
  depends_on: []
  notes: Board, reparents, fast-forward, restack, promote and landed each rebuild the ancestry-against-upstream-base
    predicate (CurrentCheckout.merged_predicate, src/basstler/stack/checkout.py). Compute it once per
    run and pass it to every phase. Measure with GIT_TRACE2 per the roadmap rule.
- id: skip-unmoved-branches
  title: Skip a branch before any merge work when nothing it depends on moved
  branch: null
  pull_request_number: null
  status: not_started
  track: pass
  depends_on:
  - landed-predicate-once
  notes: 'Of 129 restacked branches in the CRAM pass, 82 were up to date and 24 withheld: about 80 % no-op
    work. Prefer a stateless test: parent tip already an ancestor of head means up to date; withheld state
    already lives in the labels. A stored fingerprint only if truly needed, under the roadmap''s storage
    rule.'
- id: parallel-merge-tree-probes
  title: Run the read-only merge-tree probes in parallel, keeping pushes serial
  branch: null
  pull_request_number: null
  status: not_started
  track: pass
  depends_on:
  - skip-unmoved-branches
  notes: stack check ran 133 sequential merge-tree probes (5.2 s in the CRAM pass). Run the read-only
    probes in parallel; every push and label write stays serial. Probes only the branches skip-unmoved-branches
    leaves. Measure with GIT_TRACE2 per the roadmap rule.
- id: finish-summary-markdown
  title: run-report prints the finish summary as markdown, with titles on board entries
  branch: claude/gallant-sagan-s2nwxi
  pull_request_number: 68
  status: in_progress
  track: pass
  depends_on: []
  notes: 'The 138 KB report JSON had to be sliced by hand, and titles cost a 25 KB list_pull_requests.
    Board entries carry title; run-report prints, in the skill''s order: pending upstream links incl.
    earlier runs'' (promotion-link-sent, not in-review) with titles; reported branches with comment links;
    stuck reparents; landed but open; restacked/pushed; withheld (one line); skipped with reasons. Long
    prefilled bodies get a title-only fallback link. JSON stays for tooling.'
  session: https://claude.ai/code/session_01DUFP6K7toteAZTzLdMMy9o
