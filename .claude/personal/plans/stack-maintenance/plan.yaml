- id: dashboard-token-economy
  title: "Republish a dashboard only when it changed, and keep the read a republish needs small"
  branch: claude/stoic-fermat-eywarj
  track: pass
  pull_request_number: 75
  session: https://claude.ai/code/session_01J5swRVjzWWyUX1wfo9Wvs1
  notes: >
    From the PR #48 review (discussion_r4372701136). The refresh records a digest of the rendered
    page in the URL cache and reports unchanged, so the session skips the Artifact call. The
    dashboard is published as a small page plus a data file, so the read an update from another
    session requires stays a few lines. Touches basstler.dashboard and the plan-dashboard skill.
  depends_on: []
  status: in progress
- id: shared-fork-base-fast-forward
  title: Fast-forward the fork's base through one implementation, shared with session start
  branch: claude/gifted-planck-k6d3c3
  pull_request_number: 72
  status: in progress
  track: pass
  depends_on: []
  session: https://claude.ai/code/session_01DWEyg9F33n9vwvdb2deBcY
  notes: 'From the basstler#57 review (issuecomment-6404647312). maintenance.fast_forward and
    DefaultBranchSync.publish_to_fork both fetch the fork''s base, compare it with the upstream
    tip, push and re-fetch. One class in basstler.maintenance serves both, parameterised by
    fetch (session start must not write FETCH_HEAD) and by a refused push: raised in the pass,
    reported at session start. #57 has merged; based on main.'
