schema_version: 1
id: basstler-v3-stacks
title: 'basstler v3 stacks: stacks and upstream reviews from GitHub state'
description: 'Stacks are read from pull request bases, promoted upstream with a written summary
  and maintained by an Action; a fork Action mirrors upstream reviews. Split from basstler-v3
  on 2026-11-04.

  '
default_repository: KAOS-repositories/basstler
tracking_issue: 99
waves:
- id: core
  name: Core replacements
  description: Plans, stacks and upstream reviews rebuilt on GitHub state
tracks:
- id: stacks
  name: Stacks
  wave: core
- id: reviews
  name: Upstream reviews
  wave: core
items:
- id: stack-engine
  title: Stacks read from pull request bases and restacked with git rebase --update-refs
  branch: null
  pull_request_number: null
  track: stacks
  depends_on: []
  status: not started
  notes: 'No local stack metadata. Every command takes one stack (an item, a pull request
    or a branch); pushes use --force-with-lease; conflicts are reported per branch, never
    resolved by the tool.

    '
- id: upstream-promotion
  title: Contribute a branch from the fork to the upstream with a written summary
  branch: null
  pull_request_number: null
  track: stacks
  depends_on:
  - stack-engine
  status: not started
  notes: The one stack operation unique to basstler. Claude writes only the summary; the command
    opens the upstream pull request link and records it on the fork pull request. Withholds
    a branch GitHub reports conflicted, not yet computed or failing checks; no needs-resolution
    label (from stack-maintenance/withhold-on-github-state). The upstream pull request body
    closes the item's issue.
- id: maintenance-action
  title: Whole-fork maintenance runs in an Action on every push to the default branch
  branch: null
  pull_request_number: null
  track: stacks
  depends_on:
  - stack-engine
  status: not started
  notes: 'Restacks stacks whose base moved and retargets pull requests whose base landed.
    A session never runs a whole-fork pass.

    '
- id: upstream-review-mirror
  title: A fork Action mirrors upstream checks and unresolved threads onto the fork pull request
  branch: null
  pull_request_number: null
  track: reviews
  depends_on: []
  status: not started
  notes: 'One sticky comment per promoted pull request, refreshed when a branch is promoted
    or pushed and on demand. Sessions read only the fork; the helper session, the attach route
    and the request branch are retired. An on-demand run fails fast when it does not start.

    '
- id: contribute-rename
  title: Rename promote to contribute everywhere, with the label migrated
  branch: null
  track: stacks
  depends_on: []
  status: not started
  notes: Breaking (release:major). Renames the classes, Stack.promotion_order, the maintenance
    promote and stack promotion-link commands, skill text and docs, and migrates the promotion-link-sent
    label - setup creates the new one and a pass relabels pull requests carrying the old one.
    Open at kickoff - how long the old label is read, and whether the old commands stay as
    aliases for a release. Follows promote-button, which adds files it renames.
