schema_version: 1
id: team-repository
title: 'Team repository: shared plans, item issues, a board and /malloche'
description: A team repository in an organisation holds the shared plans, one issue per item, a Project
  board, and each member's own notes; /malloche picks and starts the next ready item. Pilot - cram2 with
  the domain-models plan. Split out of team-basstler.
default_repository: AbdelrhmanBassiouny/basstler
tracking_issue: 62
waves:
- id: team
  name: 'Wave 2: Team Basstler'
  description: Shared plans in an organisation's team repository, items as issues on a board, and /malloche.
tracks:
- id: team-store
  name: Team repository and notes
  wave: team
- id: github
  name: Issues, board and pull request links
  wave: team
- id: picker
  name: /malloche
  wave: team
items:
- id: team-notes-store
  title: Plans come from a configured plan store; each member's personal notes live on their own branch
    of it
  branch: null
  status: deferred
  track: team-store
  depends_on:
  - basstler-v3-plans/plan-store-issues
  notes: 'Deferred until basstler-v3 plan-store-issues: the shared plans then live as issues on the team
    repository, so the plan-store half is gone. What remains: each member writes notes.md, git identity,
    settings and pr-progress to their own notes/<login> branch of the team repository, so no two people
    ever write one branch.'
- id: team-repo-setup
  title: Set up a team repository in an organisation, and onboard a member with one command
  branch: null
  status: not_started
  track: team-store
  depends_on:
  - team-notes-store
  notes: Owner creates the repository in cram2 (name to confirm), enables Pages from Actions and Issues,
    installs the Claude GitHub App. Setup writes the hub (registry, notes_branch = default branch), site
    caller, labels and docs/team.md; a member runs setup with the team repository to get their notes branch.
    Members collaborate on the owner's CRAM fork, so stack tooling is unchanged. Conflict - basstler.setup.personal_notes
    refuses a notes remote the token's login does not own, so a member is refused on the org repository;
    allow the configured plan store, e.g. by checking push access.
- id: migrate-domain-models
  title: Move the domain-models plan from the CRAM fork's notes to the team repository
  branch: null
  status: not_started
  track: team-store
  depends_on:
  - team-repo-setup
  - basstler-v3-plans/plan-import
  notes: 'After basstler-v3, plan-import moves it into the team repository''s issues. One home: copied
    to the team plan store and removed from the fork''s notes. default_repository becomes cram2/cognitive_robot_abstract_machine;
    items whose pull requests are on the fork set repository to it. A new tracking issue on the team repository
    replaces fork #525, which gets a pointer comment.'
- id: item-issues
  title: Every plan item has an issue, a sub-issue of its plan's tracking issue, kept in step by an Action
  branch: null
  status: deferred
  track: github
  depends_on:
  - team-repo-setup
  notes: 'Superseded by basstler-v3 plan-store-issues: items are sub-issues there, the source rather than
    a sync of plan.yaml. Was: A sync command run by the team repository''s Action on every plan push:
    finds each item''s issue by a marker (nothing written back to plan.yaml), creates missing ones as
    sub-issues of the tracking issue with plan, wave and track labels, sets blocked-by from depends_on,
    and closes the issue when the item is done. The issue assignee is the item''s responsible person,
    the one source; the site shows it. GITHUB_TOKEN suffices, everything is in one repository.'
- id: project-board
  title: A Project board for the team, driven by GitHub's built-in automations
  branch: null
  status: not_started
  track: github
  depends_on:
  - basstler-v3-plans/plan-store-issues
  notes: 'One-time manual setup documented in docs/team.md: an organisation Project, auto-add by label,
    auto-add sub-issues, item closed and pull request merged move to Done, grouped by parent issue (the
    plan), views by status, by assignee and my items. No API code: an Action''s GITHUB_TOKEN cannot write
    Projects v2. Board drags do not change plan.yaml.'
- id: pr-issue-link
  title: Kickoff links an item's pull requests to its issue
  branch: null
  status: deferred
  track: github
  depends_on:
  - item-issues
  notes: 'Superseded by basstler-v3 plan-store-issues (a pull request closes its item) and upstream-promotion
    (the upstream body closes it). Was: The draft pull request body says Part of <team>#N; promotion upstream
    writes Closes <team>#N, so the upstream merge closes the issue and the board moves the card.'
- id: malloche
  title: /malloche picks the next ready item, claims it, and starts it
  branch: null
  status: not_started
  track: picker
  depends_on:
  - basstler-v3-plans/plan-store-issues
  - core-robustness/lean-kickoff
  notes: 'Ranks with work-recommender/ranked-work-list''s policy: one ranking, not two. A python -m command
    ranks: the caller''s own in-progress items first (resume), then unassigned not-started items whose
    every dependency is merged or an open pull request ready for review (a draft dependency disqualifies),
    in wave order, skipping items with blockers. When nothing is ready because dependencies are drafts,
    it says so and suggests reviewing those draft pull requests instead, ranked by how many items each
    would unblock. Claims by assigning the issue and re-reading it, backing off if someone else holds
    it;'
