schema_version: 1
id: team-repository
title: 'Teams on the plan service: shared plans and handing out work'
description: A team repository in an organisation holds the shared plans and each member's own notes,
  served by the team's own plan service instance (basstler-service); items are handed to teammates who
  implement them on their forks, and /malloche picks and starts the next ready item. Pilot - cram2 with
  the domain-models plan.
default_repository: KAOS-repositories/basstler
tracking_issue: 62
waves:
- id: team
  name: 'Wave 2: Team Basstler'
  description: Shared plans in an organisation's team repository and /malloche.
tracks:
- id: team-store
  name: Team repository and notes
  wave: team
- id: picker
  name: /malloche
  wave: team
items:
- id: team-notes-store
  title: Plans come from a configured plan store; each member's personal notes live on their own branch
    of it
  branch: null
  status: not started
  track: team-store
  depends_on: []
  notes: 'Plans come from a configured plan store: the team repository''s default branch holds the shared
    plan.yaml files, and each member writes notes.md, git identity, settings and pr-progress to their
    own notes/<login> branch of it, so no two people ever write one branch.'
- id: team-repo-setup
  title: Set up a team repository in an organisation, and onboard a member with one command
  branch: null
  status: not started
  track: team-store
  depends_on:
  - team-notes-store
  - basstler-service/service-deploy
  - basstler-service/app-manifest
  notes: Owner creates the repository in cram2 (name to confirm), enables Issues, installs the Claude
    GitHub App and the team's Basstler App, and deploys the team's instance (basstler-service/service-deploy).
    Setup writes the hub (registry, notes_branch = default branch), labels and docs/team.md; a member
    runs setup with the team repository to get their notes branch. Conflict - basstler.setup.personal_notes
    refuses a notes remote the token's login does not own; allow the configured plan store, e.g. by push
    access.
- id: migrate-domain-models
  title: Move the domain-models plan from the CRAM fork's notes to the team repository
  branch: null
  status: not started
  track: team-store
  depends_on:
  - team-repo-setup
  notes: 'One home: copied to the team plan store and removed from the fork''s notes. default_repository
    becomes cram2/cognitive_robot_abstract_machine; items whose pull requests are on the fork set repository
    to it. A new tracking issue on the team repository replaces fork #525, which gets a pointer comment.'
- id: malloche
  title: /malloche picks the next ready item, claims it, and starts it
  branch: null
  status: not started
  track: picker
  depends_on:
  - work-recommender/ranked-work-list
  - task-handout
  notes: 'Ranks with work-recommender/ranked-work-list''s policy: one ranking, not two. A python -m command
    ranks: the caller''s own in-progress items first (resume), then unassigned not-started items whose
    every dependency is merged or an open pull request ready for review (a draft dependency disqualifies),
    in wave order, skipping items with blockers. When nothing is ready because dependencies are drafts,
    it says so and suggests reviewing those draft pull requests instead, ranked by how many items each
    would unblock. It claims an item by making the caller its assignee (task-handout).'

- id: task-handout
  title: Hand an item to a teammate, who implements it on their own fork
  track: team-store
  status: not started
  depends_on:
  - team-repo-setup
  - basstler-service/plan-write-api
  notes: An item records its assignee's GitHub login, set from its card or one command through basstler-service/plan-write-api.
    The assignee's kickoff link starts the item on their fork; its pull request into the upstream reaches
    the item through the App's events, and one still on their fork once they install the App there. Only
    the assignee and the plan's writers change its status.
