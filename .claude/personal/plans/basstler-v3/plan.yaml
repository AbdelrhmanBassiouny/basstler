schema_version: 1
id: basstler-v3
title: 'basstler v3: light, reliable and easy for anyone to use and extend'
description: 'Rebuild basstler next to v2 so code does the mechanics and Claude only judges: each skill
  runs one command that prints a brief, makes its judgment, and records the result with one command. GitHub
  is the only state store: plans as issues, stacks from pull request bases, upstream reviews mirrored
  by an Action. v2 areas are deleted as v3 covers them.

  '
default_repository: AbdelrhmanBassiouny/basstler
tracking_issue: 99
waves:
- id: foundation
  name: Foundation
  description: The lighter rules and the v3 entry point
- id: core
  name: Core replacements
  description: Plans, stacks and upstream reviews rebuilt on GitHub state
- id: cutover
  name: Cutover
  description: Short skills with budgets, a slim session start, v2 removed
tracks:
- id: foundation
  name: Foundation
  wave: foundation
- id: plans
  name: Plans as issues
  wave: core
- id: stacks
  name: Stacks
  wave: core
- id: reviews
  name: Upstream reviews
  wave: core
- id: cutover
  name: Cutover
  wave: cutover
items:
- id: code-rules-light
  title: Lighter code rules, enforced by ruff and pydantic dataclasses
  branch: null
  pull_request_number: null
  track: foundation
  depends_on: []
  status: not started
  notes: 'Approved 2026-11-01: pydantic dataclasses at the external-data boundary; ruff as a dev dependency
    enforcing the mechanical rules (their prose leaves AGENTS.md); docstrings only where they add meaning;
    plain constants for true constants; a few exception types per kind of failure. No open questions:
    implement directly.'
- id: cli-launcher
  title: One basstler CLI behind a bin/ launcher, configured through userConfig
  branch: null
  pull_request_number: null
  track: foundation
  depends_on:
  - code-rules-light
  status: not started
  notes: 'bin/basstler on the Bash PATH runs the release with uv (venv in CLAUDE_PLUGIN_DATA); one command
    tree replaces the python -m modules and the sourced module variables; plugin userConfig replaces personal-notes.env.
    Verify bin/ works in cloud sessions first; fall back to a hook-written launcher if not. CLI library:
    cyclopts (approved 2026-11-01).

    '
- id: plan-store-issues
  title: Plans as a tracking issue with sub-issues, status labels and stated dependencies
  branch: null
  pull_request_number: null
  track: plans
  depends_on:
  - cli-launcher
  status: not started
  notes: 'REST only (no Projects v2, no GraphQL). Item scope in the issue body, status as a label, dependencies
    as issue references read back from the body; a pull request closes its item. Read and write go through
    pydantic models of the REST responses.

    '
- id: item-brief
  title: One command prints an item's whole brief in at most 3 KB
  branch: null
  pull_request_number: null
  track: plans
  depends_on:
  - plan-store-issues
  status: not started
  notes: 'Item scope, dependency readiness, its pull request''s checks, unresolved threads, the mirrored
    upstream state and tracking-issue comments naming it, built by code so a skill never fetches or reads
    reference docs to assemble context.

    '
- id: plan-import
  title: Import every plan.yaml into issues, once
  branch: null
  pull_request_number: null
  track: plans
  depends_on:
  - plan-store-issues
  status: not started
  notes: 'Idempotent: rerunning finds the issues already made. Landed items are not imported. Moves this
    plan onto the issue store too.

    '
- id: plan-site-from-issues
  title: The plan site reads plans from issues
  branch: null
  pull_request_number: null
  track: plans
  depends_on:
  - plan-store-issues
  status: not started
  notes: 'Point the existing Pages build at the issue store instead of plan.yaml. Retiring the Artifact
    dashboard and its URL cache is team-basstler/artifact-path-retirement.

    '
- id: stack-engine
  title: Stacks read from pull request bases and restacked with git rebase --update-refs
  branch: null
  pull_request_number: null
  track: stacks
  depends_on:
  - cli-launcher
  status: not started
  notes: 'No local stack metadata. Every command takes one stack (an item, a pull request or a branch);
    pushes use --force-with-lease; conflicts are reported per branch, never resolved by the tool.

    '
- id: upstream-promotion
  title: Promote a branch from the fork to the upstream with a written summary
  branch: null
  pull_request_number: null
  track: stacks
  depends_on:
  - stack-engine
  status: not started
  notes: The one stack operation unique to basstler. Claude writes only the summary; the command opens
    the upstream pull request link and records it on the fork pull request. Withholds a branch GitHub
    reports conflicted, not yet computed or failing checks; no needs-resolution label (from stack-maintenance/withhold-on-github-state).
- id: maintenance-action
  title: Whole-fork maintenance runs in an Action on every push to the default branch
  branch: null
  pull_request_number: null
  track: stacks
  depends_on:
  - stack-engine
  status: not started
  notes: 'Restacks stacks whose base moved and retargets pull requests whose base landed. A session never
    runs a whole-fork pass.

    '
- id: upstream-review-mirror
  title: A fork Action mirrors upstream checks and unresolved threads onto the fork pull request
  branch: null
  pull_request_number: null
  track: reviews
  depends_on:
  - cli-launcher
  status: not started
  notes: 'One sticky comment per promoted pull request, refreshed when a branch is promoted or pushed
    and on demand. Sessions read only the fork; the helper session, the attach route and the request branch
    are retired. An on-demand run fails fast when it does not start.

    '
- id: short-skills
  title: Short skills, one per job, each with a plugin eval token and time budget
  branch: null
  pull_request_number: null
  track: cutover
  depends_on:
  - item-brief
  - upstream-promotion
  - upstream-review-mirror
  status: not started
  notes: 'Each SKILL.md at most about 2 KB; no reference documents to read. Native plan mode replaces
    the auto/plan/ask execution modes. claude plugin eval cases fail CI when a skill run exceeds its token
    or wall-time budget.

    '
- id: slim-session-start
  title: Session start only writes the session's context
  branch: null
  pull_request_number: null
  track: cutover
  depends_on:
  - short-skills
  status: not started
  notes: 'No install, release lookup, default-branch sync, settings sync or Action upgrade at start: each
    happens on the command that needs it, or in an Action.

    '
- id: v2-removal
  title: 'Delete v2: the bash layer, plan.yaml tooling, dashboards and old maintenance'
  branch: null
  pull_request_number: null
  track: cutover
  depends_on:
  - slim-session-start
  - plan-import
  - plan-site-from-issues
  - maintenance-action
  status: not started
  notes: 'Major release: removed commands, files and settings. Release notes list each removed command
    with its replacement.

    '
