schema_version: 1
id: basstler-v3
title: 'basstler v3: light, reliable and easy for anyone to use and extend'
description: 'Rebuild basstler next to v2 so code does the mechanics and Claude only judges:
  each skill runs one command that prints a brief, makes its judgment, and records the result
  with one command. GitHub is the only state store: plans as issues, stacks from pull request
  bases, upstream reviews mirrored by an Action. v2 areas are deleted as v3 covers them. Plans
  are basstler-v3-plans and stacks and reviews basstler-v3-stacks.

  '
default_repository: KAOS-repositories/basstler
tracking_issue: 99
waves:
- id: foundation
  name: Foundation
  description: The lighter rules and the v3 entry point
- id: cutover
  name: Cutover
  description: Short skills with budgets, a slim session start, v2 removed
tracks:
- id: foundation
  name: Foundation
  wave: foundation
- id: cutover
  name: Cutover
  wave: cutover
items:
- id: short-skills
  title: Short skills, one per job, each with a plugin eval token and time budget
  branch: null
  pull_request_number: null
  track: cutover
  depends_on:
  - basstler-v3-plans/item-brief
  - basstler-v3-stacks/upstream-promotion
  - basstler-v3-stacks/upstream-review-mirror
  - mcp-server
  - basstler-packages/playbook-model
  status: not started
  notes: 'Each SKILL.md at most about 2 KB; no reference documents to read. Native plan mode
    replaces the auto/plan/ask execution modes. claude plugin eval cases fail CI when a skill
    run exceeds its token or wall-time budget.

    Eval cases replay the basstler-reliability report: wrong working directory, mergeable_state
    unknown, plan_site failing while stack_upstream is ok.

    '
- id: mcp-server
  title: An MCP server is the way skills call basstler, with typed tools
  branch: null
  pull_request_number: null
  track: cutover
  depends_on:
  - basstler-v3-plans/item-brief
  - basstler-packages/playbook-model
  status: not started
  notes: 'A FastMCP server (the official mcp SDK) in the plugin''s .mcp.json, used by every
    client: 5 to 8 tools with output schemas, each returning a brief or recording a result,
    so a skill never composes a shell command. The CLI stays for scripts and Actions. Never
    thin API wrappers. A decision only the user makes is asked through MCP elicitation. Adds
    the mcp dependency (approved 2026-11-01); tool definitions count against eval budgets.
    Made the main path 2026-11-03 (owner). Ships as the basstler-mcp distribution, serving
    the playbook''s McpTool components.'
- id: slim-session-start
  title: Session start only writes the session's context
  branch: null
  pull_request_number: null
  track: cutover
  depends_on:
  - short-skills
  status: not started
  notes: 'No install, release lookup, default-branch sync, settings sync or Action upgrade
    at start: each happens on the command that needs it, or in an Action.

    '
- id: v2-removal
  title: 'Delete v2: the bash layer, plan.yaml tooling, dashboards and old maintenance'
  branch: null
  pull_request_number: null
  track: cutover
  depends_on:
  - slim-session-start
  - basstler-v3-plans/plan-import
  - basstler-v3-plans/plan-site-from-issues
  - basstler-v3-stacks/maintenance-action
  status: not started
  notes: 'Major release: removed commands, files and settings. Release notes list each removed
    command with its replacement.

    '
