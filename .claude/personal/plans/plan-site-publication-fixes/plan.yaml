id: plan-site-publication-fixes
title: Plan site publication works on the first try, for private repositories too
description: Setting up the plan site for a private repository on a personal account (Hesham87/Platform_maintainer)
  failed only at the first build, after every manual step, and left a merge workflow pull
  request GitHub refused. These fixes report each problem before the user acts, and keep one
  unreadable repository from failing the whole site.
