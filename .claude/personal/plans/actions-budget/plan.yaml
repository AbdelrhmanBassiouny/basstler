schema_version: 1
id: actions-budget
title: 'Actions budget: every workflow checked, event-driven, measured and warned on'
description: GitHub once disabled Actions on the CRAM fork for wasted compute. basstler checks
  every workflow file against a tested budget, narrows pull request CI to the libraries a
  change touches, and warns before a run rate is exceeded. Moved from the CRAM fork's notes
  on 2026-10-20; the CRAM-side ci.yml half is changed-library-matrix's.
default_repository: KAOS-repositories/basstler
tracking_issue: 4
waves:
- id: budget
  name: Budget in code
  description: The budget checks, the changed-library matrix and the usage monitor.
- id: hygiene
  name: Hygiene
  description: Removing what no longer runs but still clutters the CRAM fork's branch list.
tracks:
- id: manifest
  name: Budget checks and changed-library CI
  wave: budget
- id: monitor
  name: Usage monitor and warnings
  wave: budget
- id: hygiene
  name: Stale branches
  wave: hygiene
items:
