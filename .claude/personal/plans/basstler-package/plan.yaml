- id: upstream-reviews-without-project-files
  title: /upstream-reviews works for a project that commits no basstler files
  branch: null
  status: not started
  track: cram-retirement
  depends_on: []
  pull_request_number: null
  notes: 'CRAM #523 deletes its upstream-reviews.yml and .claude/basstler/stack.toml, so the
    skill stops working there: GitHub dispatches only a workflow on the default branch, and the
    runner reads the upstream from the committed stack.toml, not personal notes. Options: dispatch
    basstler''s own reusable workflow in this repository with upstream and fork as inputs, or
    read locally when no workflow exists. Revisit setup-stacked-prs-skill''s configure-upstream.'
- id: stamps-in-git-directory
  title: The plugin keeps its per-clone stamp files where git never tracks them
  branch: null
  status: not started
  track: cram-retirement
  depends_on: []
  pull_request_number: null
  notes: 'CRAM #523 drops the .gitignore entries for .claude/.plan-state-sync-sha and
    .claude/.personal-settings-sync-hash, so they show as untracked in a plugin clone. Proposed:
    write them under $(git rev-parse --git-dir)/basstler/, which git never tracks; alternative:
    session-start.sh adds them to .git/info/exclude and check-setup.sh verifies with git
    check-ignore. The user has not picked yet.'
- id: basstler-krrood-dependency
  title: Depend on krrood's light core and use its patterns
  branch: claude/magical-albattani-9fbkd5
  status: blocked
  track: carried-across
  depends_on: []
  pull_request_number: 12
  notes: Depend on plain krrood (its light core, with a krrood[all] extra for the rest) instead
    of a separate krrood_core package. Exceptions in exceptions.py as DataclassExceptions,
    board.json through krrood's serializer. The branch predates that choice and needs reworking.
    Its TYPE_CHECKING import of ManifestKey moves to basstler.plan_model once basstler#11
    lands.
  blockers:
  - Waits on krrood publishing its light core with the krrood[all] extra.
- id: setup-stacked-prs-skill
  title: '/setup-stacked-prs: one guided command that sets up the stacked-pull-request workflow'
  branch: null
  status: not started
  track: setup
  depends_on: []
  pull_request_number: null
  notes: 'A guided skill over basstler.setup_steps subcommands, mirroring /setup-personal-notes:
    the skill only asks the questions. Native or fork-overlay install; creates labels, writes
    the personal configuration, emits the maintenance prompt. Folds in `configure-upstream
    --repository <owner>/<name>` (writes .claude/basstler/stack.toml, copies the upstream-reviews.yml
    caller), a check-setup.sh row and docs/SETUP.md section 3. Design: https://github.com/AbdelrhmanBassiouny/basstler/pull/1#discussion_r4306548238.
    Build fresh on main; CRAM #110 is stale.'
- id: cram-development-tools
  title: Install the docstring formatter and a generated AGENTS.md from the shared cram-development-tools
    package
  branch: null
  status: blocked
  track: development-tools
  depends_on: []
  pull_request_number: null
  notes: 'Design and build prompt: https://github.com/AbdelrhmanBassiouny/basstler/pull/1#discussion_r4306714398.
    A PyPI package, cram-development-tools, with `format` (today''s scripts/format_docstrings.py)
    and `agents-md [--check]` (a generic AGENTS.md followed by the repository''s AGENTS.project.md),
    both pre-commit hooks. basstler''s part: pin it in .pre-commit-config.yaml, run pre-commit
    in CI, delete scripts/format_docstrings.py, write AGENTS.project.md and commit the generated
    AGENTS.md. Open: a more neutral package name.'
  blockers:
  - Waits on the package's first PyPI release, built in the repository that hosts it.
