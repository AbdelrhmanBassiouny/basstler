    '
- id: cram-notes-cleanup
  title: Strip the tooling from the CRAM fork's personal notes
  branch: null
  status: in progress
  track: cram-retirement
  depends_on: []
  pull_request_number: null
  notes: 'Notes branch only. Done: the tooling plans, their dashboard URLs and their branches''
    progress notes moved here (CRAM notes 8c6c016, 111e30ec5), and CRAM''s notes.md no longer
    names in-tree tooling paths; its remaining rules are the user''s own, for both repositories.
    Left: actions-budget, whose basstler-code items (budget-manifest, usage-monitor) move
