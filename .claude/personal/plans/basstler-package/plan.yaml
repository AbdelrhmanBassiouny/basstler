  branch: null
  status: not started
  track: conversion
  depends_on: [basstler-notes-core-python]
  pull_request_number: null
  notes: 'session-start.sh keeps its path, so the plugin''s hooks.json stays byte-identical, but
    its body becomes one guarded shim: command -v python3 plus a >= 3.11 version probe, exiting
    0 with a single diagnostic line when absent, so the hook stays inert on machines without it.
    session_start.py reproduces the stdout summary and every written marker byte-for-byte, pinned
    by golden-output fixtures recorded from the bash version before deletion.'
