- id: setup-stacked-prs-skill
  title: '/setup-stacked-prs: one guided command that sets up the stacked-pull-request workflow'
  branch: null
  status: not started
  track: setup
  depends_on: []
  pull_request_number: null
  notes: >
    A guided skill over a scripted setup, mirroring /setup-personal-notes: the skill only asks
    the questions, every mechanical step is a basstler.setup_steps subcommand. Two install modes:
    native (the tooling on the target repository's main) and fork overlay (a never-merged tooling
    branch on the user's fork, where re-running the skill is the updater). It creates missing labels,
    writes the personal configuration and emits the maintenance prompt.

    Folded in (agreed at https://github.com/AbdelrhmanBassiouny/basstler/pull/1#discussion_r4306548238):
    a `configure-upstream --repository <owner>/<name>` subcommand writes the project's
    .claude/basstler/stack.toml and copies the example upstream-reviews.yml caller into
    .github/workflows/; the skill asks for the upstream, suggesting it from the remotes;
    check-setup.sh gains a row for it; docs/SETUP.md section 3 becomes "the setup asks you".
    No user copies files by hand.

    Build it fresh on main: an earlier draft sourced a github-api.sh that no longer exists.
- id: basstler-typed-invocations
  title: 'Typed invocations: every process and GitHub API call as a dataclass'
  branch: null
  status: not started
  track: conversion
  depends_on: []
  pull_request_number: null
  notes: >
    Design agreed at https://github.com/AbdelrhmanBassiouny/basstler/pull/1#discussion_r4306549494
    (full prompt: https://github.com/AbdelrhmanBassiouny/basstler/pull/1#discussion_r4306792682).
    An Invocation is anything run as a process and renders an argv; a GitHub API call is a separate
    Request (method, path, query or body). Parameters are dataclass fields whose role is declared
    once in metadata: option("--email"), flag("--write"), positional(). A subcommand with its own
    arguments is a method returning its own invocation (Git().remote().add(...) -> GitRemoteAdd).
    Kinds: HookScript (each subclass names its PluginLocation member as a ClassVar, and a test
    checks every hook-script member has exactly one subclass), ShellConfigurationInvocation
    (bash -c 'source ... && ...' in one place), PythonModule (python -m basstler.<module>), and
    git commands. Runners hold the where and how: ProcessRunner.run(invocation) replaces
    ScriptRunner, PythonModuleRunner, BashScriptRunner and GitCommandRunner; GitHubClient.send(request)
    mirrors it. Scope: every subprocess call in src/ and tests/, and the GitHub API calls in src/.
    It goes ahead of the conversion items, which rewrite the same calls.
