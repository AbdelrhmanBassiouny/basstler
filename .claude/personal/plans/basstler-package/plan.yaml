schema_version: 1
id: basstler-package
title: 'The basstler package: a standalone repository, its setup, and the bash layer as shims'
description: The workflow tooling now lives in this repository as one importable package beside
  its Claude Code plugin. What remains is bringing the in-flight tooling branches across, making
  the stacked-pull-request setup fully scripted, modelling every process and API call as typed
  values, converting the bash entry points into thin shims over the package one layer at a time,
  and replacing the copied development tooling with a shared, published package.
default_repository: AbdelrhmanBassiouny/basstler
tracking_issue: 4
waves:
- id: extraction
  name: The package stands alone
  description: The repository itself, the branches carried into it, and the setup path a newcomer
    reaches it by.
- id: conversion
  name: The bash layer becomes shims
  description: Typed invocations first, then each entry point's body moves onto the package and
    its script becomes a shim, in dependency order off the core modules.
- id: shared-tooling
  name: Shared development tooling
  description: Development tooling installed from a published package instead of copied in.
tracks:
- id: extraction
  name: Repository extraction
  wave: extraction
- id: carried-across
  name: Branches carried across the extraction
  wave: extraction
  description: Tooling branches that arrived rewritten with the repository's history and still
    hold unlanded work. Each gets a fresh draft pull request here.
- id: setup
  name: Guided setup
  wave: extraction
- id: cram-retirement
  name: The CRAM fork sheds the tooling
  wave: extraction
  description: The fork, and upstream cram2 through it, use basstler as a plugin and carry none
    of its code, pull requests or plans.
- id: conversion
  name: Bash to Python conversion
  wave: conversion
- id: development-tools
  name: Development tools package
  wave: shared-tooling
