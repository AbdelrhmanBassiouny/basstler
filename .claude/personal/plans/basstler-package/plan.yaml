schema_version: 1
id: basstler-package
title: 'The basstler package: a standalone repository, its setup, and CRAM moving onto it'
description: The workflow tooling now lives in this repository as one importable package beside
  its Claude Code plugin. What remains is the carried krrood branch, a fully scripted stacked-pull-request
  setup, CRAM moving onto the plugin, and replacing the copied development tooling with a
  shared, published package. Converting the bash layer into shims is the bash-to-python plan.
default_repository: AbdelrhmanBassiouny/basstler
tracking_issue: 4
waves:
- id: extraction
  name: The package stands alone
  description: The repository itself, the branches carried into it, and the setup path a newcomer
    reaches it by.
- id: shared-tooling
  name: Shared development tooling
  description: Development tooling installed from a published package instead of copied in.
tracks:
- id: extraction
  name: Repository extraction
  wave: extraction
- id: carried-across
  name: Branches carried across the extraction
  wave: extraction
  description: Tooling branches that arrived rewritten with the repository's history and still
    hold unlanded work. Each gets a fresh draft pull request here.
- id: setup
  name: Guided setup
  wave: extraction
- id: cram-retirement
  name: The CRAM fork sheds the tooling
  wave: extraction
  description: The fork, and upstream cram2 through it, use basstler as a plugin and carry
    none of its code, pull requests or plans.
- id: development-tools
  name: Development tools package
  wave: shared-tooling
items:
