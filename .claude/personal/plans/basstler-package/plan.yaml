  title: Delete the carried tooling from CRAM, and from cram2 through the promotion flow
  branch: claude/compassionate-darwin-ek7d2u
  status: in progress
  track: cram-retirement
  repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
  depends_on: []
