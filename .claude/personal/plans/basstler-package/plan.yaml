- id: cram-development-tools
  title: Install the docstring formatter and a generated AGENTS.md from the shared cram-development-tools package
  branch: null
  status: blocked
  track: development-tools
  depends_on: []
  pull_request_number: null
  notes: >
    Agreed at https://github.com/AbdelrhmanBassiouny/basstler/pull/1#discussion_r4306714398 (the
    prompt that builds the package is in that thread). The package is a proper project published to
    PyPI as cram-development-tools: `format` (black, then docformatter where the two agree, today's
    scripts/format_docstrings.py), a generic AGENTS.md shipped as package data that names no
    project except krrood, and `agents-md [--check]`, which writes AGENTS.md as the generic text
    followed by the repository's own AGENTS.project.md; both exposed as pre-commit hooks. Updates
    arrive by bumping the pinned version, and a stale AGENTS.md fails the hook in CI.

    basstler's part: pin it in .pre-commit-config.yaml, run pre-commit run --all-files in CI,
    delete scripts/format_docstrings.py, write basstler's own rules into AGENTS.project.md and
    commit the generated AGENTS.md. Open question from the thread: a neutral package name may
    age better than cram-development-tools.
  blockers:
  - Waits on the package's first PyPI release, built in the repository that hosts it.
