schema_version: 1
id: workflow-cutover
title: 'Cutover: one published site, no scheduled LLM run, the old branches retired'
description: The end state the workflow-unification work was for. Plan dashboards publish themselves from
  a single Pages site; the scheduled LLM Routine is replaced by a plain Action for the deterministic duties
  and on-demand sessions for the judgment ones; and the superseded tooling branch is tagged and deleted
  once one green cycle has run on the new paths.
default_repository: AbdelrhmanBassiouny/basstler
tracking_issue: 42
waves:
- id: cutover
  name: Cutover and retirement
  description: Each item flips a live system onto the new path and retires the old one.
tracks:
- id: cutover
  name: Cutover and retirements
  wave: cutover
items:
- id: site-pages-in-python
  title: Build the site's pages in Python instead of Jinja templates
  branch: null
  status: not_started
  track: cutover
  depends_on: []
  notes: |
    Raised by the owner on #6's dashboard.html thread (2026-10-18), offered as its own item; proposed there and awaiting confirmation. htpy (typed, dependency-free) plus dataclass section models, a StrEnum of CSS classes and a factory from Plan to page; the CSS moves to one static stylesheet. Every page already renders through TemplatePage, so only render() changes. If the owner folds it into #6 instead, drop this item.
- id: plan-site-action
  title: Deploy the plan site to stack-board's Pages, on demand rather than on a timer
  branch: null
  status: not_started
  track: cutover
  depends_on: []
  notes: 'A reusable workflow in basstler builds the site from every repository the hub file lists; AbdelrhmanBassiouny/stack-board
    calls it, reworking the draft plan-dashboards.yml on claude/plan-dashboards-site-y2vexc and dropping
    the 10-minute cron. No schedule. Rebuilt on every plan change by anyone: every notes writer (save-plan,
    sync_manifest_status, write-personal-notes-file, bootstrap) dispatches it after a push under plans/,
    as a GITHUB_TOKEN push starts no workflow, and a push-triggered caller on each notes branch catches
    hand pushes. One concurrency group. Retires board.yml.'
- id: plan-site-setup
  title: Setup registers the repository in the hub, and sessions are told the site links
  branch: null
  status: not_started
  track: cutover
  depends_on: []
  notes: |
    /setup-personal-notes adds the repository to the registry's hub file and copies the file onto this repository's notes, with no question asked; a repository with no registry configured becomes its own. The session-start summary prints the site links worked out from the hub file - the hub, this repository, and this branch's plan and item.
- id: routine-cutover
  title: 'Retire the scheduled LLM Routine: stack maintenance runs at the start of plan-item work'
  branch: claude/stack-maintenance-action
  status: in_progress
  session: https://claude.ai/code/session_019sAtT3YPyFe7yminnDEdSG
  track: cutover
  pull_request_number: 16
  blockers:
  - Deleting the live Routine on CRAM is the owner's step; the Routine's own docs (routine-prompt.md, docs/stack/README.md) go with it.
  depends_on: []
  notes: 'Reshaped 2026-10-24 with the owner (ba02b79): no Action. A mirror fork cannot carry a pull-request-triggered caller, and a session can run the pass itself, so plan-item-gathering.md starts kickoff and resolve with /stacked-pr-maintenance when an upstream is named. The workflow, example caller, run-unattended and in-pass reparent are dropped; reparents stay with the skill''s MCP step. #15 (restack --stacked-on, after a fix) complements this, and #16 will conflict with its stack.py split at the import level.'
- id: artifact-path-retirement
  title: Retire the Artifact publishing path once the Pages site has run one green cycle
  branch: null
  status: not_started
  track: cutover
  depends_on:
  - plan-site-action
  notes: 'Widened 2026-10-20/21: the site is the one surface, so every Artifact page goes, the index included.
    A session first deletes every page each repository''s _generated/dashboard-urls.yaml lists (the Artifact
    tool''s delete; an Action cannot), then removes that cache, record_dashboard_url.py and its tests,
    plan-dashboard step 3 and index mode, and the republish instruction in every plan skill and the personal
    notes, which dispatch the site workflow instead.'
- id: tooling-branch-retirement
  title: Tag and delete claude/stack-workflow-tooling after one green cycle
  branch: null
  status: not_started
  track: cutover
  depends_on:
  - routine-cutover
  - plan-site-action
  notes: Only after one full maintenance cycle and one site-Action cycle have run green on the new paths.
    claude/stack-workflow-tooling is still on the CRAM fork (checked 2026-10-21). Tag for history first.
    Tag pushes and branch deletes get a 403 through a session's git proxy, so those two steps run outside
    the harness; a session can verify and prepare the commands.
