schema_version: 1
id: workflow-cutover
title: 'Cutover: one published site, no scheduled LLM run, the old branches retired'
description: The end state the workflow-unification work was for. Plan dashboards publish
  themselves from a single Pages site; the scheduled LLM Routine is replaced by a plain Action
  for the deterministic duties and on-demand sessions for the judgment ones; and the superseded
  tooling branch is tagged and deleted once one green cycle has run on the new paths.
default_repository: AbdelrhmanBassiouny/basstler
tracking_issue: 42
waves:
- id: cutover
  name: Cutover and retirement
  description: Each item flips a live system onto the new path and retires the old one.
tracks:
- id: cutover
  name: Cutover and retirements
  wave: cutover
items:
- id: site-pages-in-python
  title: Build the site's pages in Python instead of Jinja templates
  branch: null
  status: not_started
  track: cutover
  depends_on: []
  notes: 'Raised by the owner on #6''s dashboard.html thread (2026-10-18), offered as its
    own item; proposed there and awaiting confirmation. htpy (typed, dependency-free) plus
    dataclass section models, a StrEnum of CSS classes and a factory from Plan to page; the
    CSS moves to one static stylesheet. Every page already renders through TemplatePage, so
    only render() changes. If the owner folds it into #6 instead, drop this item.

    '
- id: tooling-branch-retirement
  title: Tag and delete claude/stack-workflow-tooling after one green cycle
  branch: null
  status: not_started
  track: cutover
  depends_on: []
  notes: Only after one full maintenance cycle and one site-Action cycle (team-basstler/site-action)
    have run green on the new paths. claude/stack-workflow-tooling is still on the CRAM fork
    (checked 2026-10-21). Tag for history first. Tag pushes and branch deletes get a 403 through
    a session's git proxy, so those two steps run outside the harness; a session can verify
    and prepare the commands.
