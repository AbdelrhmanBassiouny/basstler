- id: site-pages-in-python
  title: Build the site's pages in Python instead of Jinja templates
  branch: null
  status: not_started
  track: cutover
  depends_on: []
  notes: 'Raised by the owner on #6''s dashboard.html thread (2026-10-18), offered as its
    own item; proposed there and awaiting confirmation. htpy (typed, dependency-free) plus
