schema_version: 1
id: core-robustness
title: 'Core robustness: concurrent-safe saves, lean kickoffs and typed plan models'
description: Plan saves survive concurrent writers, a kickoff loads little text, and the plan
  model and reports are typed. Split out of team-basstler.
default_repository: KAOS-repositories/basstler
tracking_issue: 62
waves:
- id: foundations
  name: 'Wave 1: Core hardened'
  description: Saves survive concurrent writers; a kickoff loads little text.
tracks:
- id: core
  name: Core robustness and token cost
  wave: foundations
items:
- id: file-key-models
  title: Workflow, pyproject, hub, board and exchange-file keys spelled only inside their
    models
  track: core
  depends_on: []
  status: not started
  notes: 'Second slice of payload-key-models: WorkflowKey (workflows, plan_site/workflows),
    PyprojectKey, HubFileKey, BoardKey and the upstream_reviews action/helper exchange keys
    become the dataclasses that read and write those files, on the pydantic base payload-key-models
    adds.'
- id: report-key-models
  title: Command reports are dataclasses, and tests read them through those
  track: core
  depends_on: []
  status: not started
  notes: 'Third slice of payload-key-models: the command-report key enums (ReportKey, MaintenanceReportKey,
    ItemBriefKey, ReadinessField, UsageOutputKey, ...) become report dataclasses with to_json,
    and tests read reports through them, reversing report-keys-in-tests (#145).'
- id: pull-request-record-model
  title: Fork pull requests are a pydantic model, not a dict read through PullRequestField
  track: core
  depends_on: []
  status: not started
  notes: Split from payload-key-models (owner). Replace PullRequestRecord and the PullRequestField,
    PullRequestHeadKey, AccountField and PullRequestFieldShape enums in maintenance/board.py
    with a pydantic pull request model; ~30 modules read the record, the plan site's live
    state and pull_request_state among them. Runs after or before basstler-packages/git-and-github-domain,
    never alongside (it moves the board record).
- id: workflow-template-values
  title: Each plan-site workflow's template values are a dataclass, not a dict of placeholder
    names
  track: core
  depends_on: []
  status: not started
  notes: 'From KAOS-repositories/basstler#140 review (workflows.py template_values). PlanSiteWorkflow.template_values
    returns a dict[str, Any] whose keys repeat each Jinja placeholder by hand in SiteWorkflow,
    DispatchWorkflow and MergeWorkflow (and UserSteps.store_token_command once #140 lands).
    Give each template a frozen dataclass of its values, rendered with dataclasses.asdict,
    so a placeholder is spelled once in its dataclass and the template. Not ValidatedJSONModel:
    the values are produced here, not parsed from outside. Changes main''s workflows only;
    rendered files stay byte-identical.'
