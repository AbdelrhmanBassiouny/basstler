schema_version: 1
id: session-notes-infrastructure
title: 'Personal notes and the session-start hook: the state a session is handed before it
  acts'
description: The personal-notes branch and the SessionStart hook that reads it. What a session
  is given at start - a fresh base, the right git identity, the local settings, the plan its
  branch belongs to, and a setup verdict - and the conventions those carry, each made a mechanism
  rather than a line of prose someone has to remember.
default_repository: KAOS-repositories/basstler
tracking_issue: 39
waves:
- id: slimming
  name: What the notes branch holds
  description: Getting the personal-notes branch down to conventions and data, and retiring
    what it superseded.
- id: handover
  name: What a session starts with
  description: 'The hook''s own work: the base, the identity, the settings, the plan, the
    setup verdict.'
- id: conventions
  name: Conventions that became mechanisms
  description: Standing rules that stopped being prose a session had to remember.
tracks:
- id: slimming
  name: Notes-branch slimming
  wave: slimming
- id: handover
  name: Session start
  wave: handover
- id: conventions
  name: Conventions made mechanical
  wave: conventions
items:
- id: stamps-in-git-directory
  title: The plugin keeps its per-clone stamp files where git never tracks them
  branch: ccr-3de36b30-i2enxe
  status: in progress
  track: handover
  session: https://claude.ai/code/session_018wfiv7sbWFZXYHbQEc77i3
  depends_on: []
  pull_request_number: 118
  notes: 'CRAM #523 dropped the .gitignore entries for .claude/.plan-state-sync-sha and .claude/.personal-settings-sync-hash,
    so the stop hook flags both as untracked in CRAM every session. Session-start must keep
    them out of the working tree and never add a tracked change to the host project. Options:
    write them under $(git rev-parse --git-dir)/basstler/ (preferred, no exclude bookkeeping),
    or add them to .git/info/exclude and verify with git check-ignore in check-setup.sh. The
    user has not picked yet.'

- id: repository-rules
  title: Per-repository plan rules as structured data, shown in item briefs and on the plan site
  branch: claude/dazzling-newton-zig14e
  status: in progress
  track: conventions
  pull_request_number: 143
  session: https://claude.ai/code/session_01JxHGiP6JUBGGaMwQ6FF7vB
  blockers:
    - >-
      Waiting on the owner: the review thread on plugin/skills/plan-create/SKILL.md asks for
      `repository-rules set` to take several rules in one call, and no syntax is chosen yet
      (repeated `--rule id=text`, a YAML file to import, or pairs of positionals).
    - >-
      Waiting on the owner: the pydantic design thread on src/basstler/plan/repository_rules.py is
      answered and left open for the owner to close or ask for a different design.
  depends_on: []
  notes: >
    The user's design priorities for every plan of a repository are prose in the personal notes'
    "Design priorities for every basstler plan" section; only sessions read them. Store them as
    a structured per-repository rules file on the notes branch (one entry per rule: id, text), edited
    by one command; plan.item_brief prints them with every item brief, the plan site shows them on
    each plan page of that repository, and plan-create links them. roadmap.md keeps plan-specific
    rules only. The personal-notes section is replaced by the file once it lands.
