schema_version: 1
id: session-notes-infrastructure
title: 'Personal notes and the session-start hook: the state a session is handed before it
  acts'
description: The personal-notes branch and the SessionStart hook that reads it. What a session
  is given at start - a fresh base, the right git identity, the local settings, the plan its
  branch belongs to, and a setup verdict - and the conventions those carry, each made a mechanism
  rather than a line of prose someone has to remember.
default_repository: KAOS-repositories/basstler
tracking_issue: 39
waves:
- id: slimming
  name: What the notes branch holds
  description: Getting the personal-notes branch down to conventions and data, and retiring
    what it superseded.
- id: handover
  name: What a session starts with
  description: 'The hook''s own work: the base, the identity, the settings, the plan, the
    setup verdict.'
- id: conventions
  name: Conventions that became mechanisms
  description: Standing rules that stopped being prose a session had to remember.
tracks:
- id: slimming
  name: Notes-branch slimming
  wave: slimming
- id: handover
  name: Session start
  wave: handover
- id: conventions
  name: Conventions made mechanical
  wave: conventions
items:
- id: session-start-tests-split
  title: Split the session-start hook tests into modules by concern
  branch: null
  pull_request_number: null
  status: not started
  track: handover
  depends_on:
  - basstler-reliability/merged-items-recorded
  notes: 'From the review of #173 (https://github.com/KAOS-repositories/basstler/pull/173#discussion_r4511800322):
    tests/hooks/test_session_start.py is about 2,000 lines. Move its tests unchanged into
    a tests/hooks/session_start/ package, one module per concern: environment and install,
    release pinning, notes sync and summary, plan state, default-branch sync, upstream-reviews
    Action, git identity and settings. Shared fixtures and helpers go to that package''s conftest.py
    or session_start_summary.py. No assertion changes; the suite''s test count stays the same.
    Waits for #172, which edits the same file.

    '
- id: session-start-source-split
  title: Split and clean up the session-start hook source by concern
  branch: null
  pull_request_number: null
  status: not started
  track: handover
  depends_on:
  - session-start-tests-split
  notes: 'From #173''s review: split resolve-personal-notes-config.sh (about 1,100 lines)
    into sourced files by concern (install, release pinning, notes branch, plan state, stamps)
    and make session-start.sh a list of named steps. Ask whether the plugin-content digest
    can go: since #173 the install source names the release. First check basstler-v3/slim-session-start
    and v2-removal, which delete this layer; if they are close, drop this item.

    '
