schema_version: 1
id: plan-tracking-skills
title: 'The plan-item skills: deciding where work goes, and recording it before doing it'
description: The skills a session uses to place a piece of work and to keep the manifest honest
  about it - deciding whether something is new work or a change to work in flight, opening
  an item's branch and draft pull request before implementation rather than after, and choosing
  whether a kickoff asks for approval or proceeds.
default_repository: AbdelrhmanBassiouny/basstler
tracking_issue: 38
waves:
- id: skills
  name: The skills themselves
  description: Each adds or corrects one decision the skills were leaving to a session's judgement.
tracks:
- id: skills
  name: Plan-item skills
  wave: skills
items:
- id: plan-item-edit-guard
  title: 'PreToolUse guard: refuse source edits from a branch with no plan item'
  branch: null
  status: not_started
  track: skills
  depends_on: []
  notes: 'The third and strongest of the three fixes recorded on `session-start-plan-and-setup-guards`,
    split out at that item''s kickoff: the only one that makes the miss impossible rather
    than merely unlikely, where the two that shipped make it unlikely by reporting better.
    A `PreToolUse` hook on `Edit|Write` that refuses a source edit from a branch no plan item
    tracks.'
- id: report-document-naming
  title: One name for the report-to-document method across the .claude tooling
  branch: null
  status: not_started
  track: skills
  depends_on: []
  notes: 'From an upstream review of cram2 #537: "i feel like you have `as_document`, `as_dict`,
    `as_json`, `as_json_dict` etc scattered across your different PRs". Measured rather than
    taken on impression: `as_document` returns a dict in two files, `to_json_dict` returns
    a dict in two more, and `as_json` returns a *str* in two others - one operation under
    two names, plus a genuinely different one under a third.'
- id: skill-document-links
  title: Skills cite their shared documents with relative links, not shell variables
  branch: null
  status: not_started
  track: skills
  depends_on:
  - stack-maintenance/manifest-currency-first
  notes: 'From the basstler#48 review (discussion_r4372858558). Claude Code substitutes only
    $ARGUMENTS and ${CLAUDE_*} in a SKILL.md, so `${SCOPE_DECISION_DOCUMENT}` and five other
    *_DOCUMENT variables (EXECUTION_MODES, PLAN_ITEM_GATHERING, PLAN_SCHEMA, DEPENDENCY_READINESS,
    PULL_REQUEST_DATA_FETCHING; 22 references) reach the model unexpanded. Replace them with
    relative Markdown links, as #48 did for manifest-staleness.md; drop each variable no
    script uses (check-setup.sh uses PLAN_SCHEMA_DOCUMENT). Depends on #48: same lines.'
