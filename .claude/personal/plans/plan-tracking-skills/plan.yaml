schema_version: 1
id: plan-tracking-skills
title: 'The plan-item skills: deciding where work goes, and recording it before doing it'
description: The skills a session uses to place a piece of work and to keep the manifest honest
  about it - deciding whether something is new work or a change to work in flight, opening
  an item's branch and draft pull request before implementation rather than after, and choosing
  whether a kickoff asks for approval or proceeds.
default_repository: AbdelrhmanBassiouny/basstler
tracking_issue: 38
waves:
- id: skills
  name: The skills themselves
  description: Each adds or corrects one decision the skills were leaving to a session's judgement.
tracks:
- id: skills
  name: Plan-item skills
  wave: skills
