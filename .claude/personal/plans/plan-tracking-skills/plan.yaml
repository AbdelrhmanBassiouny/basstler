- id: report-document-naming
  title: One name for the report-to-document method across the .claude tooling
  branch: null
  status: not_started
  track: skills
  depends_on: []
  notes: 'From an upstream review of cram2 #537: "i feel like you have `as_document`, `as_dict`,
    `as_json`, `as_json_dict` etc scattered across your different PRs". Measured rather than
    taken on impression: `as_document` returns a dict in two files, `to_json_dict` returns
