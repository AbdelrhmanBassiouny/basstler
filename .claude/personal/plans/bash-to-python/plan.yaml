  pull_request_number: null
  notes: 'Deferred 2026-11-01: superseded by basstler-v3 (#99). refresh_dashboard.sh becomes
    a shim over dashboard_refresh.py, which calls sync_manifest_status and build_dashboard
    in-process and pushes manifest corrections through NotesBranchWriter instead of shelling
    out. refresh_dashboard_support.py, which exists only as JSON plumbing for the shell orchestrator,
    is deleted and its two operations become internal functions. The single-JSON stdout contract
    and --plan-id stay unchanged; tests/test_refresh_dashboard_sh.py becomes the shim contract
    test.'
