schema_version: 1
id: bash-to-python
title: The bash layer becomes thin shims over the basstler package
description: Every process and GitHub API call modelled as typed values first, then each bash
  entry point's body moves onto the package and its script becomes a shim, one layer at a
  time in dependency order off the core modules. Split out of basstler-package on 2026-10-20.
default_repository: AbdelrhmanBassiouny/basstler
tracking_issue: 4
waves:
- id: conversion
  name: The bash layer becomes shims
tracks:
- id: conversion
  name: Bash to Python conversion
  wave: conversion
items:
- id: basstler-typed-invocations
  title: 'Typed invocations: every process and GitHub API call as a dataclass'
  branch: null
  status: deferred
  track: conversion
  depends_on: []
  pull_request_number: null
  notes: 'Deferred 2026-11-01: superseded by basstler-v3 (#99). Design: https://github.com/AbdelrhmanBassiouny/basstler/pull/1#discussion_r4306549494,
    prompt: https://github.com/AbdelrhmanBassiouny/basstler/pull/1#discussion_r4306792682.
    An Invocation renders an argv; a GitHub API call is a Request. Field metadata declares
    each parameter''s role (option, flag, positional); a subcommand returns its own invocation.
    Kinds: HookScript, ShellConfigurationInvocation, PythonModule, git commands. ProcessRunner.run
    replaces the four script runners; GitHubClient.send mirrors it. Scope: every subprocess
    call in src'
- id: basstler-test-constants
  title: Move the test modules' module-level constants into tests/constants.py
  branch: null
  status: deferred
  track: conversion
  depends_on: []
  pull_request_number: null
  notes: 'Deferred 2026-11-01: superseded by basstler-v3 (#99). test_stack.py already takes
    every value from tests/constants.py and the dataset; the other test modules still define
    module-level constants. Move them into named enums or dataclasses in tests/constants.py,
    as test_stack.py does, so no test spells a value of its own. Recorded from PR 1''s follow-up
    list.'
- id: basstler-save-commands-python
  title: 'Bash to Python 2: the notes writers become python -m subcommands that commit files
    directly'
  branch: null
  status: deferred
  track: conversion
  depends_on: []
  pull_request_number: null
  notes: 'Deferred 2026-11-01: superseded by basstler-v3 (#99). save-personal-notes.sh, save-pr-progress.sh,
    write-personal-notes-file.sh and create-personal-notes-branch.sh become shims over the
    core modules; their four scratch-worktree writes collapse into NotesBranchWriter. Folded
    in (https://github.com/AbdelrhmanBassiouny/basstler/pull/1#discussion_r4304842666): the
    save commands take the file to write and commit it directly, and CLAUDE.local.md becomes
    read-only context assembled at session start, with no marker-block extraction.'
- id: basstler-save-plan-python
  title: 'Bash to Python 3: save-plan and the plan manifest tools'
  branch: null
  status: deferred
  track: conversion
  depends_on:
  - basstler-save-commands-python
  pull_request_number: null
  notes: 'Deferred 2026-11-01: superseded by basstler-v3 (#99). save-plan.sh becomes a shim;
    plan_manifest_tools.py is absorbed as plan_manifest.py. Curated errors instead of cp/traceback
    noise: the --manifest/--roadmap source files must exist, and a roadmap must be non-empty,
    since an empty one silently overwrites roadmap.md. Both existing test files carry over,
    one with an import change and one as the shim contract test.'
- id: basstler-session-start-python
  title: 'Bash to Python 4: session-start behind an inert probing shim'
  branch: null
  status: deferred
  track: conversion
  depends_on: []
  pull_request_number: null
  notes: 'Deferred 2026-11-01: superseded by basstler-v3 (#99). session-start.sh keeps its
    path, so the plugin''s hooks.json stays byte-identical, but its body becomes one guarded
    shim: command -v python3 plus a >= 3.11 version probe, exiting 0 with a single diagnostic
    line when absent, so the hook stays inert on machines without it. session_start.py reproduces
    the stdout summary and every written marker byte-for-byte, pinned by golden-output fixtures
    recorded from the bash version before deletion.'
- id: basstler-setup-checks-python
  title: 'Bash to Python 5: check-setup as typed rows'
  branch: null
  status: deferred
  track: conversion
  depends_on: []
  pull_request_number: null
  notes: 'Deferred 2026-11-01: superseded by basstler-v3 (#99). check-setup.sh becomes a shim
