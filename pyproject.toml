# Installed into basstler's own environment by every session start that finds it missing or
# out of date: from the plugin's own release of this repository, or editable from a clone the
# plugin runs from.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basstler"
description = "Workflow tooling: stacked-pull-request maintenance, plan dashboards, personal-notes hooks and upstream review reading."
readme = "README.md"
requires-python = ">=3.12"
license = "LGPL-3.0-only"
authors = [
    {name = "Abdelrhman Bassiouny", email = "abassiou@uni-bremen.de"}
]
maintainers = [
    {name = "Abdelrhman Bassiouny", email = "abassiou@uni-bremen.de"}
]
keywords = ["stacked-pull-requests", "developer-tooling", "github", "workflow", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]

# Stated here and nowhere else: a session start, an Actions workflow and `pip install .` all
# install from this one list. `basstler.dependencies` is what reads it.
dependencies = [
    "pyyaml>=6",
    "jinja2>=3",
    "markdown>=3",
    "nh3>=0.2",
]
dynamic = ["version"]

[project.urls]
"Source" = "https://github.com/AbdelrhmanBassiouny/basstler"
"Bug Tracker" = "https://github.com/AbdelrhmanBassiouny/basstler/issues"

[tool.setuptools.dynamic]
# One release for the package and the plugin: a test holds _version.py equal to
# plugin/.claude-plugin/plugin.json's version, which is the tag an installed plugin installs
# the package at.
version = {attr = "basstler._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["basstler"]

# The files the modules resolve beside themselves rather than by an argument, all named
# in locations.py: the page templates, the GraphQL documents and the committed defaults.
# An install that left them out would import and then fail at the first render, the first
# configuration read, or the first query.
[tool.setuptools.package-data]
basstler = [
    "templates/*.html",
    "queries/*.graphql",
    "stack.toml",
    "plan-item-modes.toml",
]
