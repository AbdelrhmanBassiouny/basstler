# Installed into basstler's own environment by every session start that finds it missing or
# out of date: from the plugin's own release of this repository, or editable from a clone the
# plugin runs from.

[build-system]
requires = ["hatchling>=1.24", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "basstler"
description = "Workflow tooling: stacked-pull-request maintenance, plan dashboards, personal-notes hooks and upstream review reading."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "Abdelrhman Bassiouny", email = "bido.bassuny@gmail.com"}
]
maintainers = [
    {name = "Abdelrhman Bassiouny", email = "bido.bassuny@gmail.com"}
]
keywords = ["stacked-pull-requests", "developer-tooling", "github", "workflow", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]

# Stated here and nowhere else: a session start, an Actions workflow and `pip install .` all
# install from this one list. `basstler.setup.dependencies` is what reads it.
dependencies = [
    "pyyaml>=6",
    "jinja2>=3",
    "markdown>=3",
    "nh3>=0.2",
    "rustworkx>=0.15",
]
dynamic = ["version"]

[project.urls]
"Source" = "https://github.com/AbdelrhmanBassiouny/basstler"
"Bug Tracker" = "https://github.com/AbdelrhmanBassiouny/basstler/issues"

# One release for the package and the plugin: the tag the release workflow puts on a merge
# commit. The build reads the version from that tag, so no file names it and nothing is
# committed after a merge; a commit past the latest tag builds as the next development
# version, and a source with no git history at all as 0.0.0.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

# The whole package directory, so the files the modules resolve beside themselves rather
# than by an argument - all named in locations.py: the page templates, the GraphQL
# documents and the committed defaults - ship with it. An install that left them out would
# import and then fail at the first render, the first configuration read, or the first
# query.
[tool.hatch.build.targets.wheel]
packages = ["src/basstler"]

# Docstrings are formatted by docformatter on top of black - scripts/format_docstrings.py
# runs both, keeping docformatter's change only where black leaves it alone.
[tool.docformatter]
make-summary-multi-line = true
pre-summary-newline = true
close-quotes-on-newline = true
black = true
